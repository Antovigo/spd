# TARGETED (tPD, SPEC §11) DUAL-OBJECTIVE (SPEC S36/T12) Llama-3.1-8B layer-18
# decomposition on the 1..100 a+b / a-b prompt pool, sized for 2x L40 (dp 2).
# Runs via `python -m param_decomp.experiments.lm.run_targeted`.
#
# The current state of the art for this target: addsub-L18-14-4x's recipe — every
# importance-minimality coefficient and the shared frequency coefficient warm-starts
# at 4x its final value and decays linearly to the final value over the first 50% of
# training, then holds — with the nontarget imp-min coefficients set EQUAL to the
# target's (final 5.0e-05, as in addsub-L18-14-equal) rather than the 2-fold nontarget
# increase the 14 line inherited — and the o/down sites widened (o 128 -> 256,
# down 456 -> 512). Update this seat when the recipe advances.
run_name: jax-l18-addsub-targeted
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: list
      indices:
        - 18
    cs:
      q: 72
      k: 72
      v: 128
      o: 256
      gate: 456
      up: 456
      down: 512
  ci:
    type: chunkwise_transformer
    # One decomposed block at blocks_per_chunk 1 is a single chunk spanning all seven
    # sites; `all_block_taps` feeds it their input activations (attn in/out, MLP in,
    # MLP hidden).
    blocks_per_chunk: 1
    input_tap: all_block_taps
    d_model: 512
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 8
    ffn:
      kind: gelu
      hidden: 2048
    # The torch trainer's default init, replicated: every readout head starts W=0,
    # bias 0.5 — all CI logits mid-window, within gradient reach of both losses.
    zero_init_readout: true
    dual: true
pd:
  seed: 0
  steps: 20000
  batch_size: 128
  weight_init: coupled
  ci_scaled_weight_decay: 0.3
  components_optimizer:
    lr_schedule:
      max_val: 3.2e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      max_val: 1.6e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: null
  loss_metrics:
    - type: SmoothL0ImportanceMinimalityLoss
      # 4x the final 5.0e-05 at step 0, linear to 5.0e-05 at 50%, then held.
      coeff:
        max_val: 2.0e-04
        points:
          - {at: 0.0, frac: 1.0}
          - {at: 0.5, frac: 0.25}
          - {at: 1.0, frac: 0.25}
      normalize_at_one: true
      gamma:
        max_val: 1.0
        points:
          - {at: 0.0, frac: 1.0}
          - {at: 0.5, frac: 1.0}
          - {at: 1.0, frac: 0.01}
      frequency:
        # 4x the final 2.5e-05 at step 0, linear to 2.5e-05 at 50%, then held.
        # ONE frequency block shared across target and nontarget passes (SPEC T6).
        coeff:
          max_val: 1.0e-04
          points:
            - {at: 0.0, frac: 1.0}
            - {at: 0.5, frac: 0.25}
            - {at: 1.0, frac: 0.25}
        reference_datapoint_count: auto
    - type: StochasticReconSubsetLoss
      coeff: 1.0
      routing:
        type: uniform_k_subset
    - type: UnmaskedReconLoss
      coeff: 0.5
    - type: PersistentPGDReconLoss
      coeff: 0.5
      n_warmup_steps: 2
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          max_val: 0.01
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.025, frac: 1.0}
            - {at: 1.0, frac: 1.0}
      source_shape: bsc
  # The dual objective's HIDDEN pass (SPEC S36): the CI fn's second head scored at the
  # post-L18 MLP outputs instead of the model logits, so components stay important for
  # what layer 18 writes, not only for what survives to the unembed.
  hidden:
    points:
      - layers.18.mlp.down_proj.out
      - layers.19.mlp.down_proj.out
      - layers.20.mlp.down_proj.out
      - layers.21.mlp.down_proj.out
      - layers.22.mlp.down_proj.out
      - layers.23.mlp.down_proj.out
      - layers.24.mlp.down_proj.out
      - layers.25.mlp.down_proj.out
      - layers.26.mlp.down_proj.out
      - layers.27.mlp.down_proj.out
      - layers.28.mlp.down_proj.out
      - layers.29.mlp.down_proj.out
      - layers.30.mlp.down_proj.out
      - layers.31.mlp.down_proj.out
    # 4x the final 5.0e-05 at step 0, linear to 5.0e-05 at 50%, then held.
    impmin_coeff:
      max_val: 2.0e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.5, frac: 0.25}
        - {at: 1.0, frac: 0.25}
    recon:
      - type: StochasticReconSubsetLoss
        name: HiddenStochasticReconSubset
        coeff: 2.0
        routing:
          type: uniform_k_subset
      - type: PersistentPGDReconLoss
        name: HiddenPersistentPGDRecon
        coeff: 1.0
        n_warmup_steps: 2
        optimizer:
          type: adam
          beta1: 0.5
          beta2: 0.99
          eps: 1.0e-08
          lr_schedule:
            max_val: 0.01
            points:
              - {at: 0.0, frac: 0.0}
              - {at: 0.025, frac: 1.0}
              - {at: 1.0, frac: 1.0}
        source_shape: bsc
prompts:
  kind: prompts_file
  path: param_decomp/experiments/lm/prompts/addition_subtraction_1-100.txt
nontarget:
  batch_size: 96  # torch-reference parity, and what buys step-time parity: the broad-stream
  # passes dominate the step (seq 64 vs the pool's 5 tokens), so 128 -> 96 took the measured
  # step from 4.27 to 3.35 s on 2x L40 (2026-08-18). Peak 39.7 GB/rank of ~43.6 — an OOM here
  # does not raise (rank 0 dies mid-allocation, rank 1 waits on the clique, the job HANGS);
  # re-probe before raising.
  # Matched to the target stream: 4x 5.0e-05 at step 0, linear to 5.0e-05 at 50%, then held.
  impmin_coeff:
    max_val: 2.0e-04
    points:
      - {at: 0.0, frac: 1.0}
      - {at: 0.5, frac: 0.25}
      - {at: 1.0, frac: 0.25}
  recon:
    - type: StochasticReconSubsetLoss
      coeff: 1.0
      routing:
        type: uniform_k_subset
  hidden:
    # Matched to the target stream: 4x 5.0e-05 at step 0, linear to 5.0e-05 at 50%, then held.
    impmin_coeff:
      max_val: 2.0e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.5, frac: 0.25}
        - {at: 1.0, frac: 0.25}
    recon:
      - type: StochasticReconSubsetLoss
        name: NontargetHiddenStochasticReconSubset
        coeff: 1.0
        routing:
          type: uniform_k_subset
eval:
  # Tracks nontarget.batch_size's geometry on the broad stream; the target-stream probes
  # run at the pool's own (unpadded) geometry.
  batch_size: 128
  n_steps: 10
  every: 500
  slow_every: 4000
  slow_on_first_step: true
  metrics:
    # No UnmaskedNoDeltaReconLoss next to CEandKLLosses (same `ce_kl/kl_*` arms — the
    # evaluator refuses the pair); CIMaskedReconLoss stays for hidden_ci coverage.
    - type: CIMaskedReconLoss
    - type: CEandKLLosses
      rounding_threshold: 0.0
    - type: CI_L0
      ci_alive_threshold: 0.0
      groups:
        total: ["*"]
    # Slow-tier by declaration, and capped: on a targeted dual run this probe fans out
    # over stream x CI-role (4 ops), each 20 full fwd+bwd ascents per batch — uncapped at
    # the fast cadence it was ~10 min of every eval pass (the 2026-08-18 finding that
    # moved it to the slow tier).
    - type: PGDReconLoss
      init: random
      source_shape: c
      n_steps: 20
      step_size: 0.1
      n_batches: 4
    - type: CIHistograms
      n_batches_accum: 1
    - type: CIHiddenActsReconLoss
    - type: TwoStreamCIMeanPerComponent
    - type: WeightMagnitude
    - type: ABGridDataset
      mean_ci_floor: 0.05
      operation: add
      a_range: [1, 100]
      b_range: [1, 100]
      positions: null
      chunk_prompts: 1000
cadence:
  train_log_every: 100
  save_every: 5000
  checkpoint_retention:
    kind: keep_last
    n: 2
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  weights_dtype: bfloat16
data:
  train:
    kind: name
    name: fineweb_llama_tok_64
  eval:
    kind: name
    name: fineweb_llama_tok_64_eval
runtime:
  dp: 2
  gpus_per_node: 2
  tp: 1  # L40s are PCIe, not NVLink — tensor parallel would pay a fabric cost for nothing
  fsdp: 1  # degenerate the parameter-sharding axis: both cards go on `replicate` and the
  # frozen target stops being gathered a layer at a time inside every scan. `nvidia-smi topo
  # -p2p r` reports CNS between every GPU pair here, so that gather runs over shared memory,
  # not NVLink, and it dominates the step. Costs the full ~16GiB target resident per card
  # instead of ~9 (2.1 embed+head replicated either way, 14 of blocks). Subsumes
  # `ascend_replicate`, whose whole job is hoisting the same gather off the ascents.
  sharding: zero1
  remat_recon_forwards: true
  remat_ci_fn: true
  # A/B'd 2026-08-18 at this exact shape: sequential 3.35 s/step / 39.7 GB peak vs fused
  # 3.38 / 40.1 — the serialization costs nothing here and the memory savings come free.
  sequential_passes: true
  launch_env:
    xla_python_client_mem_fraction: 0.97  # headroom for the replicated target
wandb:
  project: param-decomp-llama
