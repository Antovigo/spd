# TARGETED (tPD, SPEC §11) Llama-3.1-8B layer-18 decomposition on the 1..100 a+b / a-b
# prompt pool, sized for 2x L40 (dp 2).
# Runs via `python -m param_decomp.experiments.lm.run_targeted`.
run_name: jax-l18-addsub-targeted
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: list
      indices:
        - 18
    cs:
      q: 72
      k: 72
      v: 128
      o: 128
      gate: 456
      up: 456
      down: 456
  ci:
    # One decomposed block at blocks_per_chunk 1 is a single chunk spanning all seven
    # sites; `all_block_taps` feeds it their input activations (attn in/out, MLP in,
    # MLP hidden).
    type: chunkwise_transformer
    blocks_per_chunk: 1
    input_tap: all_block_taps
    d_model: 512
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 8
    ffn:
      kind: gelu
      hidden: 2048
pd:
  seed: 0
  steps: 20000
  batch_size: 128
  weight_init: zero_u
  ci_scaled_weight_decay: 0.3
  components_optimizer:
    lr_schedule:
      max_val: 3.2e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      max_val: 1.6e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: null
  loss_metrics:
    - type: SmoothL0ImportanceMinimalityLoss
      coeff: 3.33e-05
      normalize_at_one: true
      gamma:
        max_val: 1.0
        points:
          - {at: 0.0, frac: 1.0}
          - {at: 0.5, frac: 1.0}
          - {at: 1.0, frac: 0.01}
      frequency:
        coeff: 1.67e-05
        reference_datapoint_count: 640  # pd.batch_size 128 x the pool's 5 tokens
    - type: MergedStochasticSubsetPPGDReconLoss
      # `0.5 stochastic + g(t)*0.5 PPGD` in expectation, one forward: coeff*(1-f) = 0.5
      # and coeff*f = 0.5*g give coeff = 0.5*(1+g), f = g/(1+g) — hence BOTH knobs
      # scheduled on the same 20%->30% activation ramp. Editing one alone breaks the
      # identity.
      coeff:
        max_val: 1.0
        points:
          - {at: 0.0, frac: 0.5}
          - {at: 0.2, frac: 0.5}
          - {at: 0.3, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      adv_fraction:
        max_val: 0.5
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.2, frac: 0.0}
          - {at: 0.3, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      routing:
        type: uniform_k_subset
      n_warmup_steps: 2
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          max_val: 0.01
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.025, frac: 1.0}
            - {at: 1.0, frac: 1.0}
      source_shape: bsc
prompts:
  kind: prompts_file
  path: param_decomp/experiments/lm/prompts/addition_subtraction_1-100.txt
nontarget:
  batch_size: 24  # sets the logit-space peak: 24x64 positions x 128256 vocab in the fused
  # two-pass backward. The binding constraint is the executable's temp buffer (XLA's single
  # compile-time-sized block for every intermediate), which grows far slower than linearly in
  # batch — 17.93GiB at 24, 22.27 at 32, 23.05 at 48 — so batch is a weak memory lever. 24 was
  # chosen against a temp buffer sized for 32-block forwards; the prefix-reuse split makes every grid forward 14 blocks,
  # and the measured peak is now 32.9 of ~43.6GiB, so there is room to raise this back toward
  # the torch reference's 96. An OOM here does not raise — rank 0 dies mid-allocation while
  # rank 1 waits on the clique, so the job HANGS. Raise only against a fresh smoke.
  impmin_coeff: 6.67e-05  # the reference's 2x target ratio, authored absolute
  recon:
    - type: StochasticReconSubsetLoss
      coeff: 1.0
      routing:
        type: uniform_k_subset
eval:
  # Tracks nontarget.batch_size: the broad-stream probes run at the same geometry,
  # and the 20-step PGD probe ascends through its own backward.
  batch_size: 24
  n_steps: 10
  every: 500
  slow_every: 1000
  slow_on_first_step: true
  metrics:
    # --- broad (NON-TARGET) stream: `data.eval` is the only source the eval loop reads
    - type: CEandKLLosses
      rounding_threshold: 0.0
    - type: CI_L0
      ci_alive_threshold: 0.0
      groups:
        total: ["*"]
    - type: PGDReconLoss
      init: random
      source_shape: c
      n_steps: 20
      step_size: 0.1
    - type: CIHistograms
      n_batches_accum: 1
    - type: CIHiddenActsReconLoss
    # --- target stream: the run's own prompt pool
    - type: TargetPoolScalars
      ci_alive_threshold: 0.0
      ci_l0_groups:
        total: ["*"]
      fresh_pgd:
        n_steps: 20
        step_size: 0.1
    - type: TwoStreamCIMeanPerComponent
    - type: WeightMagnitude
cadence:
  train_log_every: 100
  save_every: 5000
  checkpoint_retention:
    kind: keep_last
    n: 2
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  weights_dtype: bfloat16
data:
  train:
    kind: name
    name: fineweb_llama_tok_64
  eval:
    kind: name
    name: fineweb_llama_tok_64_eval
runtime:
  dp: 2
  gpus_per_node: 2
  tp: 1  # L40s are PCIe, not NVLink — tensor parallel would pay a fabric cost for nothing
  fsdp: 1  # degenerate the parameter-sharding axis: both cards go on `replicate` and the
  # frozen target stops being gathered a layer at a time inside every scan. `nvidia-smi topo
  # -p2p r` reports CNS between every GPU pair here, so that gather runs over shared memory,
  # not NVLink, and it dominates the step. Costs the full ~16GiB target resident per card
  # instead of ~9 (2.1 embed+head replicated either way, 14 of blocks). Subsumes
  # `ascend_replicate`, whose whole job is hoisting the same gather off the ascents.
  sharding: zero1
  remat_recon_forwards: true
  remat_ci_fn: true
  launch_env:
    xla_python_client_mem_fraction: 0.97  # headroom for the replicated target
wandb:
  project: param-decomp-llama
