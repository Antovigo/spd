# CI filter, objective 1: full-vocabulary KL at the last prompt position.
# Fine-tunes the output CI fn of addsub-all-layers-4xh100-05 (components frozen, weight delta
# off, deterministic CI masks) on both operations of the 1..100 addition/subtraction grid.
# Template seat: every field spelled out; parse-gated by tests/ci_filter/test_ci_filter.py.
run: {kind: id, id: p-ba5a0c05}
step: 40000
init: {kind: run}
pool:
  operations: [add, sub]
  a_range: [1, 100]
  b_range: [1, 100]
objective: {kind: last_position_kl}
steps: 5000
batch_size: 1024
microbatch_size: null  # hardware-only; set to what one forward/backward fits
eval_batch_size: 1000
seed: 0
remat: true
# The decomposition's own target-pass recon (MergedStochasticSubsetPPGDReconLoss, weight delta ON),
# scored by this filter's objective: the H100 recipe. A 1x L40 only fits
# `recon: {kind: ci_masked, coeff: 1.5}` (deterministic CI masks, delta off).
recon:
  kind: merged_stochastic_ppgd
  coeff: 1.5
  adv_fraction:
    max_val: 0.3333333
    points:
      - {at: 0.0, frac: 0.0}
      - {at: 0.05, frac: 1.0}
      - {at: 1.0, frac: 1.0}
  n_warmup_steps: 0  # the target stream repeats (20k prompts), so the per-step final ascent may suffice
  optimizer:
    type: adam
    beta1: 0.5
    beta2: 0.99
    eps: 1.0e-08
    lr_schedule:
      max_val: 0.01
      points:
        - {at: 0.0, frac: 0.0}
        - {at: 0.0125, frac: 1.0}
        - {at: 1.0, frac: 1.0}
imp_min:
  # The decomposition's imp-min schedules, replayed over this run: 4x at step 0, down to
  # the final value at 25% and held.
  coeff:
    max_val: 2.0e-04
    points:
      - {at: 0.0, frac: 1.0}
      - {at: 0.25, frac: 0.25}
      - {at: 1.0, frac: 0.25}
  # Re-annealed over the last half so switched-off components can leave and CI ends binary.
  gamma:
    max_val: 1.0
    points:
      - {at: 0.0, frac: 1.0}
      - {at: 0.5, frac: 1.0}
      - {at: 1.0, frac: 0.01}
  normalize_at_one: true
  frequency_coeff:
    max_val: 1.0e-04
    points:
      - {at: 0.0, frac: 1.0}
      - {at: 0.25, frac: 0.25}
      - {at: 1.0, frac: 0.25}
  reference_datapoint_count: 640
lr_schedule:
  max_val: 4.0e-05
  points:
    - {at: 0.0, frac: 1.0}
    - {at: 1.0, frac: 0.1, interp: cosine}
betas: [0.9, 0.999]
grad_clip_norm: null
alive_threshold: 0.01
eval_every: 1000
log_every: 10
# The decomposition's 20-step fresh-PGD recon eval, scored by this filter's objective at the last
# position, on the starting and the final CI fn (both run at the end).
pgd_eval:
  n_steps: 20
  step_size: 0.1
  n_batches: 4
  batch_size: 128
wandb: {project: arithmetic, entity: null}
grid:
  mean_ci_floor: 0.05
  chunk_prompts: 1000
compilation_cache_dir: ~/.cache/param-decomp/xla
