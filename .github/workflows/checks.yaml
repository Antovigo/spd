name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Import smoke
        run: |
          uv run python -c "import param_decomp, param_decomp_lab"
          uv run python -c "import param_decomp.built_run; from param_decomp.components import SiteSpec"
          uv run pd-lm --help > /dev/null

  lint-type:
    name: lint + type (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --no-fix
      - run: uv run ruff format --check
      - run: make type

  test:
    name: tests (py3.13, non-slow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache JAX compile cache
        uses: actions/cache@v4
        with:
          path: .jax_test_cache
          key: jax-test-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: >
          uv run pytest
          param_decomp/tests/ param_decomp_lab/tests/ param_decomp_lab/experiments/
          --numprocesses 4 --dist worksteal --durations 15
