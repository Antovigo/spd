# Multi-chunk JAX leg (12 decomposed layers -> 12 chunks of 3 sites; SPEC S10 at
# n_chunks > 1). 32 GPU, per-rank batch 1 (the 12 serial checkpointed chunk forwards
# are activation-heavy; 8-GPU bench peaked 137GB/dev at bl1). Matched torch leg for
# multi-chunk semantics is pd-lm-fsdp (ChunkwiseSubsetReconLoss), NOT the old
# optimize.py path (its StochasticReconSubsetLoss routes uniform-k over all 36 sites
# jointly — a different objective).
run_name: jax-l20-31-b32-cmp32
out_dir: /mnt/data/artifacts/mechanisms/param-decomp/jax_runs
seed: 0
steps: 3000
target:
  model_name: meta-llama/Llama-3.1-8B
  first_layer: 20
  last_layer: 31
  C: 8192
data:
  dir: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048
  seq_len: 2048
  global_batch: 32
losses: { faith: 1.0e+5, imp: 5.0e-6, stoch: 0.5, ppgd: 0.5 }
imp_min:
  beta: 0.2
  eps: 1.0e-12
  p_start: 2.0
  p_final: 0.4
  anneal_start_frac: 0.0
  anneal_end_frac: 1.0
ppgd:
  lr: 0.01
  lr_warmup_frac: 0.025
  beta1: 0.5
  beta2: 0.99
  eps: 1.0e-8
  n_warmup: 2
recon: { sites_per_chunk: 3, n_samples: 1 }
vu_optimizer: { lr: 1.5e-4, grad_clip_norm: 0.01 }
ci_optimizer: { lr: 5.0e-5 }
ci_fn: { d_model: 4096, n_blocks: 4, n_heads: 64, mlp_hidden: 16384 }
faith_warmup: { steps: 400, lr: 1.0e-3 }
cadence: { log_every: 20, save_every: 1000, keep_last: 2 }
wandb: { project: param-decomp-llama, entity: goodfire }
