# addsub-L18-25-answer-words (2026-11-11): addsub-L18-24-answer-words with -08's adversarial,
# rider and minimality settings, at L18-24's higher learning rates and 20k-step schedule
# (Antoine, 2026-11-11). Same pool (a, b integer operands, 0..399), ranks, datasets, H100.
#
# DELTA FROM addsub-L18-24-answer-words
# 1. adv_fraction max 0.4736842 -> 0.9 on all four merged stochastic+PPGD terms (-08's
#    PGD:stochastic 9:1), total coeff unchanged; the ramp keeps L18-24's `at: 0.005`.
# 2. Hidden-pass e2e KL rider at -08's rule, scaled to one block: each hidden term's KL weight
#    equals its stream's output-pass coeff, so pd.hidden.output_coeff 0.25 -> 0.5
#    (3.0 x 0.5 = 1.5) and nontarget.hidden.output_coeff 0.5 -> 1.0 (1.0 x 1.0 = 1.0).
# 3. Minimality x 4/3 on both streams: the imp-min coeff (2.0e-4 -> 2.6666667e-4), the
#    frequency coeff shared by every pass (1.0e-4 -> 1.3333333e-4), pd.hidden.impmin_coeff
#    (2.0e-4 -> 2.6666667e-4) and both non-target impmin_coeffs (8.0e-4 -> 1.0666667e-3).
#    Why 4/3: every objective averages over all 10 positions, 4 of which (BOS, Answer, :,
#    space) are identical in every prompt; -08's 5-token prompts varied at 4 of 5 positions,
#    this pool at 6 of 10, and 0.8 / 0.6 = 4/3.
# 4. Unchanged: L18-24's learning rates (3.2e-4 / 1.6e-4), schedule (20k steps), CI-scaled
#    weight decay on the target stream's hidden-head CI, all-position reconstruction on both
#    streams, AB grids at the last position (addition).
# 5. eval.slow_every 2000 -> 1000: AB grids every 1000 steps, from step 1000 (the other slow
#    metrics run every 1000 too).
#
# addsub-L18-24-answer-words (2026-11-11): the layer-18 test of addsub-all-layers-4xh100-09, on one
# H100 SXM. It is addsub-L18-24 (the single-block mirror of the 32-block recipe, header below)
# with -09's changes; a and b are integer operands, 0..399.
#
# DELTA FROM addsub-L18-24
# 1. Prompt pool: answer_words_addition_subtraction_0-399.txt — `Answer: {a} plus {b} is ` and
#    `Answer: {a} minus {b} is ` (trailing space kept), a, b in 0..399, subtraction a >= b,
#    240200 prompts of 10 tokens. The original model's answer-token cross-entropy on it is
#    0.042 / 0.024 nats (add / sub) vs 0.97 / 2.40 on the bare format (~/out/prompt_format_scan).
# 2. neuron_ranks: addsub0-399-answer-words_llama31-8b_unit-energy (harvested on that pool).
# 3. ABGridDataset: a, b in [0, 399], `prompt_template` = the addition format, chunk_prompts
#    2000; last position only (as before).
# 4. Datasets: fineweb_llama_tok_64{,_eval}_one_doc_per_row — the same rows, each one document,
#    row-shuffled (the merged trainer reads only document-aware, row-shuffled datasets);
#    `data.layout: documents`, `seq_len: 64`.
# 5. One GPU: mesh 1/1/1 (was 2/1/1 ddp on 2x L40), so each step's whole batch sits on one
#    card: target 128 x 10 tokens, non-target 96 x 64.
# 6. eval.slow_every 4000 -> 2000, so the AB grids (a slow metric) are recorded every 2000 steps;
#    the other slow metrics run twice as often too.
# 7. launch_env: CUDA-graph capture off for every jit (`--xla_gpu_enable_command_buffer=`); on
#    jax 0.11.1 the CI fn's init jit failed to capture on the L40 smoke.
# Code: feature/dual_obj_jax-upstream-2026-11 (upstream fe8ae9e07 merged).
#
# addsub-L18-24: UNTESTED candidate successor to addsub-L18-sota.yaml (addsub-L18-23-neuronaligned,
# p-6540dfdd). The single-block (layer 18, 2x L40) version of the 32-block SOTA
# addsub-all-layers-4xh100-sota.yaml (-05, p-ba5a0c05), reduced the way
# ~/pd_scratch/dual_obj_jax/addsub-all-layers-04-block30.yaml was, then adjusted (Antoine,
# 2026-09-17). Generated from -05 with its comments stripped; read -05's header for the
# rationale behind every inherited choice.
#
# FROM -05, REDUCED TO ONE BLOCK:
#   layers all -> [18]; hidden points 32 -> 14 (L18..L31, the L18 seat's convention); the hidden
#   recon coeffs back to the L18 per-point weight (6.8571429 -> 3.0 target, 2.2857143 -> 1.0
#   non-target, i.e. x14/32); mesh 1/4/zero1 -> 2/1/ddp and mem_fraction 0.88 -> 0.97 (the L18
#   seat's L40 values).
#
# ADJUSTED:
#   steps 40000 -> 20000, with the L18 SOTA's schedule fractions: imp-min/frequency decay ends at
#     0.5, gamma held to 0.5, PPGD source LR warmup 0.025, adversarial-share ramps 0.005,
#     save_every 5000.
#   nontarget.batch_size 128 -> 96 (the L18 SOTA's).
#   LR 8.0e-05 / 4.0e-05 -> 3.2e-04 / 1.6e-04 (components / CI fn; the L18 SOTA's).
#   hidden-pass e2e KL rider (output_coeff) halved from the output-pass-matched value:
#     pd.hidden 0.5 -> 0.25 (KL at 0.75 against the term's 3.0), nontarget.hidden 1.0 -> 0.5.
#   CI-scaled weight decay (0.2) reads the TARGET stream's HIDDEN-head CI only, max over the batch
#     (quantile 1.0).
#   every merged stochastic+PPGD term (target and non-target, output and hidden): steady-state
#     PGD:stochastic 0.9:1, adv_fraction 0.4736842 (= 0.9/1.9) at unchanged total coeff. -05 had
#     1:2 on the target stream (adv_fraction 1/3) and 1:1 on the non-target stream (0.5).
#
# DIFFERENCES FROM addsub-L18-sota.yaml, therefore: init neuron_aligned_zero_u; hidden
# normalization per_position; C doubled (q/k 144, v 256, o 512, gate/up 912, down 1024); ci_scaled_weight_decay
# 0.3 (all CI) -> 0.2 (target hidden CI); target stochastic+PPGD pairs merged (output 1.5, hidden
# 3.0, both at PGD:stochastic 0.9); hidden output_coeff riders added; non-target impmin 2e-04 -> 8e-04 (both
# passes), non-target merged terms source_shape c -> bsc, n_warmup_steps 0 -> 1, PGD:stochastic 1 -> 0.9;
# NCCL_NVLS_ENABLE=0.
run_name: addsub-L18-25-answer-words
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: list
      indices:
        - 18
    cs:
      q: 144
      k: 144
      v: 256
      o: 512
      gate: 912
      up: 912
      down: 1024
    initialization: neuron_aligned_zero_u
    neuron_ranks: {kind: name, name: addsub0-399-answer-words_llama31-8b_unit-energy}
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    input_tap: all_block_taps
    d_model: 512
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 8
      implementation: xla
      mask: bidirectional  # the pre-017a17af4 CI attention was implicitly bidirectional
    ffn:
      kind: gelu
      hidden: 2048
    zero_init_readout: true
    dual: true
pd:
  seed: 0
  steps: 20000
  batch_size: 128
  ci_scaled_weight_decay: 0.2
  ci_scaled_weight_decay_stream: target
  ci_scaled_weight_decay_role: hidden
  ci_scaled_weight_decay_quantile: 1.0
  components_optimizer:
    lr_schedule:
      max_val: 3.2e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      max_val: 1.6e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    betas: [0.9, 0.999]
    weight_decay: 0.0
    grad_clip_norm: null
  loss_metrics:
    - type: ImportanceMinimalityLoss
      coeff:
        max_val: 2.6666667e-04
        points:
          - {at: 0.0, frac: 1.0}
          - {at: 0.5, frac: 0.25}
          - {at: 1.0, frac: 0.25}
      normalize_at_one: true
      gamma:
        max_val: 1.0
        points:
          - {at: 0.0, frac: 1.0}
          - {at: 0.5, frac: 1.0}
          - {at: 1.0, frac: 0.01}
      frequency:
        coeff:
          max_val: 1.3333333e-04
          points:
            - {at: 0.0, frac: 1.0}
            - {at: 0.5, frac: 0.25}
            - {at: 1.0, frac: 0.25}
        reference_datapoint_count: auto
    - type: MergedStochasticSubsetPPGDReconLoss
      coeff: 1.5
      adv_fraction:
        max_val: 0.9
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.005, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      n_warmup_steps: 2
      routing:
        type: uniform_k_subset
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          max_val: 0.01
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.025, frac: 1.0}
            - {at: 1.0, frac: 1.0}
      source_shape: bsc
    - type: UnmaskedReconLoss
      coeff: 0.5
  hidden:
    points:
      - layers.18.mlp.down_proj.out
      - layers.19.mlp.down_proj.out
      - layers.20.mlp.down_proj.out
      - layers.21.mlp.down_proj.out
      - layers.22.mlp.down_proj.out
      - layers.23.mlp.down_proj.out
      - layers.24.mlp.down_proj.out
      - layers.25.mlp.down_proj.out
      - layers.26.mlp.down_proj.out
      - layers.27.mlp.down_proj.out
      - layers.28.mlp.down_proj.out
      - layers.29.mlp.down_proj.out
      - layers.30.mlp.down_proj.out
      - layers.31.mlp.down_proj.out
    normalization: {kind: per_position, floor_fraction: 0.01}
    output_coeff: 0.5
    impmin_coeff:
      max_val: 2.6666667e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.5, frac: 0.25}
        - {at: 1.0, frac: 0.25}
    recon:
      - type: MergedStochasticSubsetPPGDReconLoss
        name: HiddenMergedStochasticPPGDRecon
        coeff: 3.0
        adv_fraction:
          max_val: 0.9
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.005, frac: 1.0}
            - {at: 1.0, frac: 1.0}
        routing:
          type: uniform_k_subset
        n_warmup_steps: 2
        optimizer:
          type: adam
          beta1: 0.5
          beta2: 0.99
          eps: 1.0e-08
          lr_schedule:
            max_val: 0.01
            points:
              - {at: 0.0, frac: 0.0}
              - {at: 0.025, frac: 1.0}
              - {at: 1.0, frac: 1.0}
        source_shape: bsc
prompts:
  kind: prompts_file
  path: param_decomp/param_decomp/experiments/lm/prompts/answer_words_addition_subtraction_0-399.txt
nontarget:
  batch_size: 96
  impmin_coeff:
    max_val: 1.0666667e-03
    points:
      - {at: 0.0, frac: 1.0}
      - {at: 0.5, frac: 0.25}
      - {at: 1.0, frac: 0.25}
  recon:
    - type: MergedStochasticSubsetPPGDReconLoss
      coeff: 1.0
      adv_fraction:
        max_val: 0.9
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.005, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      n_warmup_steps: 1
      routing:
        type: uniform_k_subset
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          max_val: 0.01
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.025, frac: 1.0}
            - {at: 1.0, frac: 1.0}
      source_shape: bsc
  hidden:
    output_coeff: 1.0
    impmin_coeff:
      max_val: 1.0666667e-03
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.5, frac: 0.25}
        - {at: 1.0, frac: 0.25}
    recon:
      - type: MergedStochasticSubsetPPGDReconLoss
        name: NontargetHiddenMergedStochasticPPGDRecon
        coeff: 1.0
        adv_fraction:
          max_val: 0.9
          points:
            - {at: 0.0, frac: 0.0}
            - {at: 0.005, frac: 1.0}
            - {at: 1.0, frac: 1.0}
        n_warmup_steps: 1
        routing:
          type: uniform_k_subset
        optimizer:
          type: adam
          beta1: 0.5
          beta2: 0.99
          eps: 1.0e-08
          lr_schedule:
            max_val: 0.01
            points:
              - {at: 0.0, frac: 0.0}
              - {at: 0.025, frac: 1.0}
              - {at: 1.0, frac: 1.0}
        source_shape: bsc
eval:
  batch_size: 128
  n_steps: 10
  every: 500
  slow_every: 1000  # 4000 in addsub-L18-24: AB-grid snapshots every 1000 steps, for early results (Antoine, 2026-11-11)
  slow_on_first_step: true
  metrics:
    - type: CIMaskedReconLoss
    - type: CEandKLLosses
      rounding_threshold: 0.0
    - type: CI_L0
      ci_alive_threshold: 0.0
      groups:
        total: ["*"]
    - type: PGDReconLoss
      init: random
      source_shape: c
      n_steps: 20
      step_size: 0.1
      n_batches: 4
    - type: TwoStreamCIMeanPerComponent
    - type: WeightMagnitude
    - type: ABGridDataset
      mean_ci_floor: 0.05
      operation: add
      a_range: [0, 399]
      b_range: [0, 399]
      prompt_template: "Answer: {a} plus {b} is "
      positions: null
      chunk_prompts: 2000
cadence:
  train_log_every: 100
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
target:
  output_edge:
    kind: materialized  # the pre-017a17af4 behaviour: full logits every forward
  attention_implementation: xla
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  weights_dtype: bfloat16
data:
  train:
    kind: name
    name: fineweb_llama_tok_64_one_doc_per_row
  eval:
    kind: name
    name: fineweb_llama_tok_64_eval_one_doc_per_row
  layout: documents
  seq_len: 64
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  compiler_options: tuned-v2  # tuned-v1 retired upstream (jaxlib 0.11)
  mesh:
    replicate: 1
    fsdp: 1
    tp: 1
  sharding: ddp
  remat_recon_forwards: true
  remat_ci_fn: true
  sequential_passes: true
  launch_env:
    xla_python_client_mem_fraction: 0.97
    xla_flags: "--xla_gpu_nccl_termination_timeout_seconds=600 --xla_gpu_enable_command_buffer="
    env:
      NCCL_NVLS_ENABLE: "0"
wandb:
  project: param-decomp-llama
