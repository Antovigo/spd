# Integer-only global mask of addsub-answers-11, final checkpoint. As addsub-answers-09.yaml, with
# ONE λ (the mask sparsity coefficient): 5.0e-05, the λ the -09 sweep picked (Antoine, 2026-11-15:
# no sweep). Every unlisted setting is the IntegerOnlyConfig default (plan:
# notes/integer_only/plan.md). Run from the repository root (`prompts` is relative to it).
# The pick rule still applies, with the bar raised to 0.3 (Antoine, 2026-11-15; -09 used 0.1): if
# this λ's mean KL_int on Q is not below 0.3, `pick` fails and nothing is collected.
