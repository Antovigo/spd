prompts: param_decomp/param_decomp/experiments/lm/prompts/answer_words_addition_subtraction_0-399.txt
templates:
  add: "Answer: {a} plus {b} is "
  sub: "Answer: {a} minus {b} is "
lambdas: [5.0e-05]
