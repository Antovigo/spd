<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RMSNorm divisors — panoptic — addsub -08</title>
<style>
  :root { --surface: #fcfcfb; --ink: #1d1d1b; --ink2: #55554f; --muted: #8a8a83; --rule: #e4e3df; --panel: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 24px 0; }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .defs { color: var(--ink2); max-width: 1250px; margin: 0 0 10px; font-size: 13px; }
  .defs p { margin: 3px 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); padding: 0 24px; }
  .tabs button { border: 1px solid var(--rule); border-bottom: 0; background: #f3f2ef; color: var(--ink2);
                 padding: 7px 14px; font: inherit; cursor: pointer; border-radius: 6px 6px 0 0; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }
  #status { color: var(--muted); font-size: 12px; padding: 4px 24px; min-height: 22px; }
  .scroller { overflow: auto; height: calc(100vh - var(--top, 240px)); padding: 0 24px 24px; }
  table { border-collapse: separate; border-spacing: 0; }
  th { font-weight: 500; color: var(--ink2); font-size: 12px; background: var(--surface); }
  thead th { position: sticky; z-index: 2; }
  thead tr:nth-child(1) th { top: 0; height: 22px; }
  thead tr:nth-child(2) th { top: 22px; height: 20px; color: var(--muted); }
  thead th.group { border-bottom: 1px solid var(--rule); }
  th.row { position: sticky; left: 0; z-index: 1; text-align: right; padding-right: 8px; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  th.corner { position: sticky; left: 0; z-index: 3; }
  td { padding: 2px; }
  td.gap, th.gap { padding: 0; width: 10px; min-width: 10px; }
  tr.block-start td, tr.block-start th.row { border-top: 1px solid var(--rule); }
  canvas { display: block; width: 100px; height: 100px; image-rendering: pixelated; cursor: pointer; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--rule);
         border-radius: 6px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
         display: none; z-index: 10; font-variant-numeric: tabular-nums; }
  #tip .v { font-weight: 650; }
  #tip .l { color: var(--ink2); }
</style>
</head>
<body>
<header>
  <h1>RMSNorm divisors on the addsub pool — panoptic view</h1>
  <div class="defs" id="defs"></div>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="status"></div>
<div class="scroller" id="scroller"><table id="grid"></table></div>
<div id="tip"></div>
<script src="meta.js"></script>
<script>
window.PANOPTIC = {};
const M = window.RMS_META;
const TABS = [["original", "Original (Llama-3.1-8B)"], ["ci_masked", "CI-masked decomposition"],
              ["alive_only", "Alive-only decomposition"], ["ratio", "Ratio CI-masked / original"]];
const OPS = ["+", "−"];
const RAMP = ["#cde2fb","#b7d3f6","#9ec5f4","#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6",
              "#256abf","#1c5cab","#184f95","#104281","#0d366b"];
const DIV = ["#184f95","#2a78d6","#6da7ec","#b7d3f6","#f0efec","#f6c8c5","#ec8f8c","#e34948","#a32f2f"];
function lutOf(hexes) {
  const ramp = hexes.map(h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16))), lut = new Uint8Array(768);
  for (let i = 0; i < 256; i++) {
    const x = i / 255 * (ramp.length - 1), j = Math.min(Math.floor(x), ramp.length - 2), f = x - j;
    for (let c = 0; c < 3; c++) lut[3*i+c] = Math.round(ramp[j][c] * (1-f) + ramp[j+1][c] * f);
  }
  return lut;
}
const H_MIN = 1e-3;  // ratio colour scale reaches at least 1 ± 0.1 %
const LUT = lutOf(RAMP), DLUT = lutOf(DIV);
const NP = M.points.length, NT = M.positions.length;

document.getElementById("defs").innerHTML = `
<p>Prompts <code>a+b=</code> / <code>a-b=</code>, integer operands <b>a</b>, <b>b</b> in 1..400 (run <code>${M.source.run_dir.split("/").pop()}</code>,
step ${M.source.step}, filter <code>${M.source.filter}</code>). Each cell is one heatmap over the prompts, rows = a (1 at the top), columns = b
(1 at the left), each pixel the mean over a 4 × 4 block of (a, b). Value: the RMSNorm divisor <b>s</b> = √(r² + ε), with <b>r</b> = √(mean over the
4,096 dimensions of x²), <b>x</b> the raw residual-stream vector, <b>ε</b> = ${M.eps}.</p>
<p>Rows: stream point <b>p</b> = 0..64 (p = 0 the embedding; for block <b>l</b> = 0..31, p = 2l + 1 after its attention add, p = 2l + 2 after
its MLP add; point p is the input of the p-th RMSNorm). Columns: token position <b>t</b> (0 &lt;BOS&gt;, 1 a, 2 op, 3 b, 4 =) × operation.
Every cell has its own linear colour scale, min (light) to max (dark); the ratio tab (s<sub>CI-masked</sub> / s<sub>original</sub>, binned per prompt)
is blue &lt; 1, grey = 1, red &gt; 1, symmetric about 1 to the cell's largest |ratio − 1|, but at least to 1 ± 0.001 (smaller deviations, e.g. the 4 × 10⁻⁶ rounding at p = 0, stay grey). Hover for values; click a cell to open it at full
resolution in the single-view applet.</p>`;

const tabsEl = document.getElementById("tabs");
TABS.forEach(([key, label]) => {
  const b = document.createElement("button");
  b.setAttribute("role", "tab"); b.textContent = label; b.dataset.key = key;
  b.onclick = () => show(key);
  tabsEl.appendChild(b);
});

// table skeleton: header rows, one row per point, 10 canvases per row
const grid = document.getElementById("grid");
const thead = grid.createTHead(), h1 = thead.insertRow(), h2 = thead.insertRow();
const corner = document.createElement("th"); corner.className = "corner"; corner.rowSpan = 2; h1.appendChild(corner);
for (let t = 0; t < NT; t++) {
  if (t) { const g = document.createElement("th"); g.className = "gap"; g.rowSpan = 2; h1.appendChild(g); }
  const th = document.createElement("th"); th.colSpan = 2; th.className = "group";
  th.textContent = `t = ${t}: ${M.positions[t]}`; h1.appendChild(th);
  for (let op = 0; op < 2; op++) { const s = document.createElement("th"); s.textContent = `a ${OPS[op]} b`; h2.appendChild(s); }
}
const tbody = grid.createTBody(), canvases = [];
for (let p = 0; p < NP; p++) {
  const tr = tbody.insertRow();
  if (p % 2 === 1) tr.className = "block-start";
  const th = document.createElement("th"); th.className = "row";
  th.textContent = `${p} · ${M.points[p]}`; tr.appendChild(th);
  for (let t = 0; t < NT; t++) {
    if (t) { const g = tr.insertCell(); g.className = "gap"; }
    for (let op = 0; op < 2; op++) {
      const c = document.createElement("canvas");
      c.dataset.p = p; c.dataset.t = t; c.dataset.op = op;
      tr.insertCell().appendChild(c);
      canvases.push(c);
    }
  }
}

const cache = {};
function load(key) {
  if (cache[key]) return cache[key];
  cache[key] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `data/panoptic_${key}.js`;
    s.onload = () => {
      const d = window.PANOPTIC[key]; delete window.PANOPTIC[key];
      const bin = atob(d.q), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      resolve({...d, q: new Uint16Array(bytes.buffer)});
    };
    s.onerror = () => reject(new Error(`missing data/panoptic_${key}.js`));
    document.head.appendChild(s);
  });
  return cache[key];
}

let cur = null, curKey = null;
const cellIndex = (p, t, op) => (p * NT + t) * 2 + op;
async function show(key) {
  curKey = key;
  history.replaceState(null, "", `#${key}`);
  tabsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.key === key));
  document.getElementById("status").textContent = "loading…";
  let d;
  try { d = await load(key); } catch (e) { document.getElementById("status").textContent = e.message; return; }
  if (curKey !== key) return;
  cur = d;
  const S = d.side, ratio = key === "ratio", lut = ratio ? DLUT : LUT;
  for (const c of canvases) {
    const i = cellIndex(+c.dataset.p, +c.dataset.t, +c.dataset.op), lo = d.lo[i], hi = d.hi[i];
    c.width = S; c.height = S;
    const ctx = c.getContext("2d"), img = ctx.createImageData(S, S), off = i * S * S;
    const h = Math.max(Math.abs(lo - 1), Math.abs(hi - 1), H_MIN);
    for (let j = 0; j < S * S; j++) {
      const qv = d.q[off + j];
      let k;
      if (hi === lo) k = ratio ? Math.min(255, Math.max(0, Math.round(((lo - 1) / h + 1) * 127.5))) : 128;
      else if (ratio) k = Math.min(255, Math.max(0, Math.round((((lo + qv / 65535 * (hi - lo)) - 1) / h + 1) * 127.5)));
      else k = qv >> 8;
      img.data[4*j] = lut[3*k]; img.data[4*j+1] = lut[3*k+1]; img.data[4*j+2] = lut[3*k+2]; img.data[4*j+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  document.getElementById("status").textContent = `${TABS.find(x => x[0] === key)[1]} — ${canvases.length} cells`;
}

function fmt(v, ratio) { return ratio ? v.toFixed(5) : Math.abs(v) >= 100 ? v.toFixed(1) : Math.abs(v) >= 1 ? v.toFixed(3) : v.toPrecision(4); }
const tip = document.getElementById("tip");
grid.addEventListener("pointermove", e => {
  const c = e.target;
  if (!(c instanceof HTMLCanvasElement) || !cur) { tip.style.display = "none"; return; }
  const p = +c.dataset.p, t = +c.dataset.t, op = +c.dataset.op, S = cur.side, B = cur.bin;
  const r = c.getBoundingClientRect();
  const col = Math.min(S - 1, Math.floor((e.clientX - r.left) / r.width * S));
  const row = Math.min(S - 1, Math.floor((e.clientY - r.top) / r.height * S));
  const i = cellIndex(p, t, op), lo = cur.lo[i], hi = cur.hi[i], ratio = curKey === "ratio";
  const v = lo + cur.q[i * S * S + row * S + col] / 65535 * (hi - lo);
  tip.replaceChildren();
  const lines = [
    ["v", `${ratio ? "ratio" : "s"} = ${fmt(v, ratio)}`],
    ["l", `a ${row * B + 1}..${row * B + B} ${OPS[op]} b ${col * B + 1}..${col * B + B} (mean of the ${B} × ${B} block)`],
    ["l", `p = ${p} (${M.points[p]}) · t = ${t} (${M.positions[t]})`],
    ["l", hi === lo ? `constant over the pool` : `cell min ${fmt(lo, ratio)} · max ${fmt(hi, ratio)}`],
  ];
  for (const [cls, text] of lines) { const div = document.createElement("div"); div.className = cls; div.textContent = text; tip.appendChild(div); }
  tip.style.display = "block";
  tip.style.left = `${Math.min(e.clientX + 16, window.innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8)}px`;
});
grid.addEventListener("pointerleave", () => { tip.style.display = "none"; });
grid.addEventListener("click", e => {
  const c = e.target;
  if (c instanceof HTMLCanvasElement) window.open(`index.html?p=${c.dataset.p}&t=${c.dataset.t}&op=${c.dataset.op}`, "_blank");
});

function fit() { document.documentElement.style.setProperty("--top", `${document.getElementById("scroller").getBoundingClientRect().top}px`); }
window.addEventListener("resize", fit); fit();
const start = location.hash.slice(1);
show(TABS.some(x => x[0] === start) ? start : "original");
</script>
</body>
</html>
