# FSDP single-pool correctness smoke: vendored GPT2 (openai-community/gpt2) decomposing
# block 6's MLP (c_fc 768->3072, c_proj 3072->768). All 4 losses (faith/imp/stoch/ppgd).
# Exercises FSDP2 shard + compile + residual-start + DCP save + requeue/resume + async
# consolidate+eval. checkpoint_blocks=false (PPGD requires it). Tiny: 40 steps, save@15.
# Launch: pd-lm-fsdp param_decomp_lab/experiments/lm/_fsdp/gpt2_mlp_smoke.yaml --dp 4 --qos opportunistic --time 1:00:00
cadence:
  keep_last_n_checkpoints: 3
  save_every: 15
  train_log_every: 5
  dense_log_phase: { every: 2, until_step: 20 }
data:
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  column_name: input_ids
  is_tokenized: true
  max_seq_len: 512
  streaming: false
  tokenizer_name: openai-community/gpt2
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
eval:
  batch_size: 8
  every: 10
  n_steps: 1
  slow_every: 30
  slow_on_first_step: true
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
pd:
  batch_size: 8
  seed: 0
  n_mask_samples: 1
  sampling: continuous
  sigmoid_type: leaky_hard
  use_delta_component: true
  tied_weights: null
  identity_decomposition_targets: null
  steps: 40
  ci_config:
    fn_type: global_shared_transformer
    mode: global
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 768
      n_blocks: 2
      mlp_hidden_dim:
      - 3072
      attn_config:
        n_heads: 12
        max_len: 512
        rope_base: 10000.0
  decomposition_targets:
  - C: 2048
    module_pattern: h.6.mlp.c_fc
  - C: 2048
    module_pattern: h.6.mlp.c_proj
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    weight_decay: 0.0
    lr_schedule:
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    weight_decay: 0.0
    lr_schedule:
      fn_type: cosine
      start_val: 1.5e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
  faithfulness_warmup_steps: 5
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 100000.0
  - type: ImportanceMinimalityLoss
    coeff: 5.0e-06
    beta: 0.2
    eps: 1.0e-12
    pnorm: 2.0
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.4
    p_anneal_end_frac: 1.0
  - type: StochasticReconLayerwiseLoss
    coeff: 0.5
  - type: PersistentPGDReconLoss
    coeff: 0.5
    n_samples: 1
    n_warmup_steps: 2
    start_frac: 0.0
    use_sigmoid_parameterization: false
    scope:
      type: broadcast_across_batch
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
runtime:
  autocast_bf16: true
  device: cuda:0
  compile_model: true
  compile_ci_fn: true
  checkpoint_blocks: false
  shard_frozen_target: true
target:
  activation_checkpointing: false
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.pretrain.models.gpt2_simple.GPT2Simple
    model_name: openai-community/gpt2
wandb:
  entity: goodfire
  project: param-decomp
