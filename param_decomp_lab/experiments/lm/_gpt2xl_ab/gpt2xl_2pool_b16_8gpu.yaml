# Clean equal-GPU A/B (round 2): torch 2-pool GPT-2-XL.
# 8 GPU, global batch 16 (SAME as the 1-pool cells). Topology: pool_a per_rank 4 (n_a=4) +
# chunkwise per_rank 4 (chunk_dp=4) x n_chunks 1 = 8 GPU; both pools process the full batch 16.
# Decompose 3 MLP layers (h.20/21/22 c_fc + down_proj), C=8192, seq 1024 — matched to the jax
# stage13 cell + the torch 1-pool config (same model weights, sites, C, CI fn, losses, batch).
# 2-pool requires the vendored componentizable GPT2Simple (kind hf_weights_in_vendored); the
# 1-pool cell uses kind:hf GPT2LMHeadModel — same GPT-2-XL weights/arch, different code path.
# Launch: PYTHONPATH=. .venv/bin/python -m param_decomp_lab.experiments.lm.two_pool_run <this>
cadence:
  train_log_every: 5
data:
  buffer_size: 1000
  column_name: input_ids
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  eval_split: train
  is_tokenized: true
  max_seq_len: 1024
  shuffle_each_epoch: true
  streaming: true
  tokenizer_name: openai-community/gpt2
  train_split: train
eval:
  batch_size: 16
  every: 100000
  metrics:
  - groups: null
    type: CI_L0
  n_steps: 1
  slow_every: 100000
  slow_on_first_step: false
pd:
  batch_size: 16
  ci_config:
    fn_type: global_shared_transformer
    hidden_dims: null
    mode: global
    simple_transformer_ci_cfg:
      attn_config:
        max_len: 1024
        n_heads: 8
        rope_base: 10000.0
      d_model: 1024
      mlp_hidden_dim:
      - 4096
      n_blocks: 5
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 1.5e-04
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 8192
    module_pattern: h.20.mlp.c_fc
  - C: 8192
    module_pattern: h.20.mlp.down_proj
  - C: 8192
    module_pattern: h.21.mlp.c_fc
  - C: 8192
    module_pattern: h.21.mlp.down_proj
  - C: 8192
    module_pattern: h.22.mlp.c_fc
  - C: 8192
    module_pattern: h.22.mlp.down_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 2
  faithfulness_warmup_weight_decay: 0.0
  identity_decomposition_targets: null
  losses:
    faith:
      coeff: 100000.0
      type: FaithfulnessLoss
    imp:
      beta: 0.2
      coeff: 5.0e-06
      eps: 1.0e-12
      p_anneal_end_frac: 1.0
      p_anneal_final_p: 0.4
      p_anneal_start_frac: 0.0
      pnorm: 2.0
      type: ImportanceMinimalityLoss
    stoch:
      coeff: 0.5
      type: StochasticReconLayerwiseLoss
    ppgd:
      coeff: 0.5
      n_samples: 1
      n_warmup_steps: 2
      optimizer:
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          final_val_frac: 1.0
          fn_type: constant
          start_val: 0.01
          warmup_pct: 0.025
        type: adam
      scope:
        type: broadcast_across_batch
      start_frac: 0.0
      type: PersistentPGDReconLoss
      use_sigmoid_parameterization: false
    recon_plan:
      type: subset
      routing:
        type: uniform_k_subset
      n_samples: 1
  n_mask_samples: 1
  sampling: continuous
  seed: 0
  sigmoid_type: leaky_hard
  steps: 60
  tied_weights: null
  use_delta_component: true
runtime:
  autocast_bf16: true
  device: cuda:0
  topology:
    pool_a:
      per_rank_batch: 4
    chunkwise:
      per_rank_batch: 4
      sites_per_chunk: null
      n_chunks: 1
    use_fused_kl: true
target:
  activation_checkpointing: true
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.pretrain.models.gpt2_simple.GPT2Simple
    model_name: openai-community/gpt2-xl
