# Targeted decomposition (tPD) of Llama-3.1-8B layer-18 MLP on the addition task.
# Target distribution: "a+b=" prompts (a,b in [1,100]); nontarget: FineWeb.
# Derived from llama-3.1-8b.yaml with: C reduced ~100x, a much smaller CI transformer,
# nontarget seq_len 64, no FaithfulnessLoss + faithfulness_warmup_steps 0 (tPD rules),
# and the targeted nontarget/eval wiring.
label: llama8b_addition
pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 256        # free internal width (input proj 22528->d_model, head d_model->sum C)
      n_blocks: 2
      mlp_hidden_dim:
      - 512
      attn_config:
        n_heads: 4        # d_head = 64 (even -> RoPE ok)
        max_len: 64       # must cover the longest pass (nontarget seq_len 64)
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: model.layers.18.mlp.gate_proj
    C: 200
  - module_pattern: model.layers.18.mlp.up_proj
    C: 200
  - module_pattern: model.layers.18.mlp.down_proj
    C: 200  # 14336 neurons
  identity_decomposition_targets: null
  use_delta_component: true
  components_optimizer:
    lr_schedule:
      start_val: 1.0e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1.0e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  steps: 20000
  batch_size: 64
  faithfulness_warmup_steps: 0
  loss_metrics:
  - type: ImportanceMinimalityLoss
    coeff: 1.0e-04
    pnorm: 2.0
    beta: 0.5
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.5
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: StochasticReconSubsetLoss
    coeff: 1.0
    routing:
      type: uniform_k_subset
  - type: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
cadence:
  train_log_every: 100
eval:
  n_steps: 1
  batch_size: 64
  every: 1000
  slow_every: 5000
  slow_on_first_step: true
  metrics:
  - type: CI_L0
    groups:
      total:
      - '*'
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
  - type: TargetReconLoss
    rounding_threshold: 0.01
  - type: NontargetReconLoss
    rounding_threshold: 0.01
  - type: NontargetCIMeanPerComponent
  - type: CIMeanPerComponent
  # TargetedCIHeatmap omitted: it requires prompts_file == data.prompts_file and renders
  # one row per prompt, so the 10k-prompt addition target would make it unusable.
  - type: WeightMagnitude
  - type: CIHiddenActsReconLoss
target:
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
  output_extract: logits
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  prompts_file: param_decomp_lab/experiments/lm/prompts/addition_1-100.txt
  max_seq_len: 16
nontarget:
  data:
    tokenizer_name: meta-llama/Llama-3.1-8B
    max_seq_len: 64
    buffer_size: 1000
    dataset_name: HuggingFaceFW/fineweb
    data_files: sample/350BT/*.parquet
    revision: 9bb295ddab0e05d785b879661af7260fed5140fc
    column_name: text
    train_split: train
    eval_split: train
    shuffle_each_epoch: true
    is_tokenized: false
    streaming: true
  batch_size: 64
  eval_batch_size: 64
  impmin_coeff_ratio: 1.0
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
wandb:
  project: param-decomp-llama
