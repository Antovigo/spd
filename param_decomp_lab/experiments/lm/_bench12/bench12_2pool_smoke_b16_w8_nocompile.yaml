# Bench12 2-pool SINGLE-NODE 8-GPU smoke: same Llama-8B MLP L20-31, 36 sites, C=8192 workload
# as the 16-GPU smoke, but a topology that fits one node — isolates whether the multi-node
# startup hang (49451) is specific to cross-NODE new_group / NCCL, and gets *a* 2-pool number.
# Topology: chunkwise n_chunks=6 (sites_per_chunk=6 -> 2 layers/chunk, chunk_dp=1) = 6 ranks
# + pool_a(per_rank_batch=8, n_a=2) = 2 ranks. batch16 -> world=8 GPU (single node).
# Launch: pd-lm-2pool <this> --partition None --time 1:00:00
cadence:
  keep_last_n_checkpoints: 1
  save_every: 100000
  train_log_every: 5
  dense_log_phase: { every: 2, until_step: 30 }
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 2048
  shuffle_each_epoch: true
  streaming: true
  tokenizer_name: meta-llama/Llama-3.1-8B
  train_split: train
eval: null
pd:
  batch_size: 16
  ci_config:
    fn_type: global_shared_transformer
    hidden_dims: null
    mode: global
    simple_transformer_ci_cfg:
      attn_config:
        max_len: 2048
        n_heads: 64
        rope_base: 10000.0
      d_model: 4096
      mlp_hidden_dim:
      - 16384
      n_blocks: 4
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 1.5e-04
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - { C: 8192, module_pattern: layers.20.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.20.mlp.up_proj }
  - { C: 8192, module_pattern: layers.20.mlp.down_proj }
  - { C: 8192, module_pattern: layers.21.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.21.mlp.up_proj }
  - { C: 8192, module_pattern: layers.21.mlp.down_proj }
  - { C: 8192, module_pattern: layers.22.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.22.mlp.up_proj }
  - { C: 8192, module_pattern: layers.22.mlp.down_proj }
  - { C: 8192, module_pattern: layers.23.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.23.mlp.up_proj }
  - { C: 8192, module_pattern: layers.23.mlp.down_proj }
  - { C: 8192, module_pattern: layers.24.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.24.mlp.up_proj }
  - { C: 8192, module_pattern: layers.24.mlp.down_proj }
  - { C: 8192, module_pattern: layers.25.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.25.mlp.up_proj }
  - { C: 8192, module_pattern: layers.25.mlp.down_proj }
  - { C: 8192, module_pattern: layers.26.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.26.mlp.up_proj }
  - { C: 8192, module_pattern: layers.26.mlp.down_proj }
  - { C: 8192, module_pattern: layers.27.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.27.mlp.up_proj }
  - { C: 8192, module_pattern: layers.27.mlp.down_proj }
  - { C: 8192, module_pattern: layers.28.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.28.mlp.up_proj }
  - { C: 8192, module_pattern: layers.28.mlp.down_proj }
  - { C: 8192, module_pattern: layers.29.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.29.mlp.up_proj }
  - { C: 8192, module_pattern: layers.29.mlp.down_proj }
  - { C: 8192, module_pattern: layers.30.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.30.mlp.up_proj }
  - { C: 8192, module_pattern: layers.30.mlp.down_proj }
  - { C: 8192, module_pattern: layers.31.mlp.gate_proj }
  - { C: 8192, module_pattern: layers.31.mlp.up_proj }
  - { C: 8192, module_pattern: layers.31.mlp.down_proj }
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 5
  faithfulness_warmup_weight_decay: 0.0
  identity_decomposition_targets: null
  losses:
    faith:
      coeff: 100000.0
      type: FaithfulnessLoss
    imp:
      beta: 0.2
      coeff: 5.0e-06
      eps: 1.0e-12
      p_anneal_end_frac: 1.0
      p_anneal_final_p: 0.4
      p_anneal_start_frac: 0.0
      pnorm: 2.0
      type: ImportanceMinimalityLoss
    stoch:
      coeff: 0.5
      type: StochasticReconLayerwiseLoss
    ppgd:
      coeff: 0.5
      n_samples: 1
      n_warmup_steps: 2
      optimizer:
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          final_val_frac: 1.0
          fn_type: constant
          start_val: 0.01
          warmup_pct: 0.025
        type: adam
      scope:
        type: broadcast_across_batch
      start_frac: 0.0
      type: PersistentPGDReconLoss
      use_sigmoid_parameterization: false
    recon_plan:
      type: subset
      routing:
        type: uniform_k_subset
      n_samples: 1
  n_mask_samples: 1
  sampling: continuous
  seed: 0
  sigmoid_type: leaky_hard
  steps: 60
  tied_weights: null
  use_delta_component: true
runtime:
  autocast_bf16: true
  compile_ppgd: false
  compile_chunkwise: false
  compile_ci_fn: false
  device: cuda:0
  topology:
    pool_a:
      per_rank_batch: 8
    chunkwise:
      per_rank_batch: 16
      sites_per_chunk: 6
      n_chunks: 6
    use_fused_kl: true
target:
  activation_checkpointing: true
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: goodfire
  project: param-decomp-llama
