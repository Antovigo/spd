pd:
  batch_size: 96
  ci_config:
    fn_type: global_shared_transformer
    hidden_dims: null
    mode: global
    simple_transformer_ci_cfg:
      attn_config:
        max_len: 64
        n_heads: 6
        rope_base: 10000.0
      d_model: 384
      mlp_hidden_dim:
      - 1536
      n_blocks: 4
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 0.001
      warmup_pct: 0.0
    weight_decay: 0.0
  ci_scaled_component_weight_decay: 0.2
  ci_scaled_component_weight_decay_start_frac: 0.5
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.0
      fn_type: cosine
      start_val: 0.001
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 228
    module_pattern: model.layers.18.mlp.gate_proj
  - C: 228
    module_pattern: model.layers.18.mlp.up_proj
  - C: 228
    module_pattern: model.layers.18.mlp.down_proj
  - C: 96
    module_pattern: model.layers.18.self_attn.q_proj
  - C: 96
    module_pattern: model.layers.18.self_attn.k_proj
  - C: 116
    module_pattern: model.layers.18.self_attn.v_proj
  - C: 116
    module_pattern: model.layers.18.self_attn.o_proj
