    coeff_anneal_end_frac: 1.0
    coeff_anneal_start_frac: 0.05
    coeff_peak_multiplier: 10.0
    coeff_warmup_frac: 0.05
    eps: 1.0e-12
    name: null
    p_anneal_end_frac: 1.0
    p_anneal_final_p: 0.5
    p_anneal_start_frac: 0.0
    pnorm: 2.0
    type: ImportanceMinimalityLoss
  - coeff: 1.0
    name: null
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    name: null
    type: UnmaskedReconLoss
  - coeff: 0.5
    n_samples: 1
    n_warmup_steps: 2
    name: null
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    scope:
      type: per_batch_per_position
    start_frac: 0.0
    type: PersistentPGDReconLoss
    use_sigmoid_parameterization: false
  n_mask_samples: 1
  sampling: continuous
  seed: 0
  sigmoid_type: leaky_hard
