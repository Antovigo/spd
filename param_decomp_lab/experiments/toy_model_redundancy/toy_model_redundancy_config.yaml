pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 64
      n_blocks: 2
      attn_config:
        n_heads: 4
        max_len: 8
        rope_base: 10000.0
      final_rms_norm: true
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: blocks.*.q
    C: 8
  - module_pattern: blocks.*.k
    C: 8
  - module_pattern: blocks.*.v
    C: 16
  - module_pattern: blocks.*.o
    C: 16
  identity_decomposition_targets: null
  use_delta_component: true
  batch_size: 512
  steps: 10000
  components_optimizer:
    lr_schedule:
      start_val: 2e-3
      fn_type: constant
      warmup_pct: 0.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 2e-3
      fn_type: constant
      warmup_pct: 0.0
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.1
  loss_metrics:
  - type: SmoothL0ImportanceMinimalityLoss
    coeff: 2e-4
    gamma: 1.0
    beta: 0.5
    gamma_final: 0.01
    gamma_anneal_start_frac: 0.75
    gamma_anneal_end_frac: 1.0
    normalize_at_one: true
  - type: StochasticReconLayerwiseLoss
    coeff: 1.0
  - type: StochasticReconLoss
    coeff: 1.0
  - type: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
    scope:
      type: per_batch_per_position
    start_frac: 0.0
    use_sigmoid_parameterization: false
cadence:
  train_log_every: 100
eval:
  n_steps: 20
  batch_size: 512
  every: 500
  slow_every: 5000
  slow_on_first_step: true
  metrics:
  - type: CIHistograms
    n_batches_accum: 5
  - type: ComponentActivationDensity
    ci_alive_threshold: 0.1
  - type: CI_L0
    groups: null
    ci_alive_threshold: 0.1
  - type: CIMeanPerComponent
  - type: ToyRedundancyCIPlot
    ci_alive_threshold: 0.1
label: toy_model_redundancy
target:
  run_path: toy_model_redundancy/copy_training_v8d32_partial
data: {}
runtime:
  autocast_bf16: false
  device: cuda
  dp: null
wandb:
  project: param-decomp
