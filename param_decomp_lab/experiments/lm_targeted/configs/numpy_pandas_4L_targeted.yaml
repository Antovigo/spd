# Targeted PD on the 4L pile LlamaSimpleMLP (t-9d2b8f02): target = "import numpy/pandas as".
#
# SCAFFOLD / REFERENCE CONFIG. Ported from the torch tPD branch
# (feature/targeted:param_decomp_lab/experiments/lm/numpy_pandas_4L_targeted.yaml) and
# adapted toward the JAX schema. The `data:` (target prompts) + `nontarget:` blocks and the
# tPD eval metrics are the new tPD surface; exact field reconciliation with the JAX
# `LMTargetedExperimentConfig` / eval schema happens when the build is implemented
# (notes/targeted_jax_plan.md Phase 2/5). Do not launch until build_targeted_from_schema
# and the composition root are filled in.
run_name: np_pd_ref_targeted
pd:
  seed: 0
  # CI fn: torch used a global-shared MLP (hidden 512). Reconcile with the JAX CiConfig
  # union (global_shared_mlp) during Phase 2.
  ci_config:
    fn_type: global_shared_mlp
    hidden_dims: [512]
  decomposition_targets:
    - {module_pattern: h.*.mlp.c_fc, C: 96}
    - {module_pattern: h.*.mlp.down_proj, C: 96}
    - {module_pattern: h.*.attn.q_proj, C: 64}
    - {module_pattern: h.*.attn.k_proj, C: 64}
    - {module_pattern: h.*.attn.v_proj, C: 64}
    - {module_pattern: h.*.attn.o_proj, C: 96}
  steps: 30000
  batch_size: 256
  faithfulness_warmup_steps: 0   # tPD: delta must stay nonzero (validator enforces == 0)
  components_optimizer:
    lr_schedule: {start_val: 1.0e-4, warmup_pct: 0.0, final_val_frac: 0.1, fn_type: cosine}
    weight_decay: 0.1
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule: {start_val: 1.0e-4, warmup_pct: 0.0, final_val_frac: 0.1, fn_type: cosine}
  loss_metrics:
    # NO FaithfulnessLoss (validator forbids it) — tPD keeps the delta nonzero.
    - type: ImportanceMinimalityLoss
      coeff: 1.0e-3
      pnorm: 2.0
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 1.0
      p_anneal_end_frac: 1.0
      coeff_warmup_frac: 0.2
      coeff_peak_multiplier: 4.0
      coeff_anneal_start_frac: 0.2
      coeff_anneal_end_frac: 1.0
    - type: StochasticReconSubsetLoss
      coeff: 1.0
      routing: {type: uniform_k_subset}
    # Target-pass adversarial ablation of the delta (dropped from the non-target pass).
    - type: PersistentPGDReconLoss
      coeff: 0.5
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        lr_schedule: {start_val: 0.01, warmup_pct: 0.025, final_val_frac: 0.1, fn_type: cosine}
      scope: {type: per_batch_per_position}
      n_warmup_steps: 2
      start_frac: 0.8
cadence:
  train_log_every: 100
eval:
  every: 1000
  n_steps: 1
  batch_size: 256
  slow_every: 4000
  slow_on_first_step: true
  metrics:
    - {type: CEandKLLosses, rounding_threshold: 0.0}   # required by the scalar tier
    - {type: CI_L0, groups: {total: ['*']}}
    - {type: PGDReconLoss, init: random, mask_scope: c, n_steps: 20, step_size: 0.1}
    # tPD eval metrics (JAX ports — Phase 5). Names carried from the torch impl:
    #   - TargetReconLoss / NontargetReconLoss (delta 0.0 vs 1.0)
    #   - TargetedCIHeatmap (target-prompt row over a non-target row)
    #   - WeightMagnitude
target:
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
data:
  # TARGET stream: fixed prompts, tokenized once (data.TargetPromptServer).
  prompts_file: param_decomp_lab/experiments/lm_targeted/prompts/numpy_and_pandas.txt
  tokenizer_name: EleutherAI/gpt-neox-20b
  max_seq_len: 3
nontarget:
  # NON-TARGET stream: the broad pile distribution (pre-tokenized parquet). Delta forced on.
  data:
    dataset_name: parquet
    data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/pile_neox_tok_512/*.parquet
    tokenizer_name: EleutherAI/gpt-neox-20b
    column_name: input_ids
    max_seq_len: 64
    is_tokenized: true
    streaming: false
  batch_size: 256
  eval_batch_size: 256
  impmin_coeff_ratio: 2.0
runtime:
  dp: null   # inline smoke; set to a multiple of 8 for SLURM
wandb:
  project: param-decomp
