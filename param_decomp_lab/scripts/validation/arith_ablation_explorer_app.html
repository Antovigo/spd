<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arithmetic ablation explorer</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel2:#20242e; --ink:#e6e8ee; --muted:#9aa3b2;
          --line:#2c313c; --accent:#d957a8; --accent2:#5ab0e0; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;
       font:13px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  h1{margin:0;font-size:16px;font-weight:600;}
  header{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:0 0 auto;}
  header .sub{color:var(--muted);font-size:12px;}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--panel);
            border-bottom:1px solid var(--line);padding:8px 18px;flex:0 0 auto;}
  .controls label{color:var(--muted);margin-right:5px;} .grp{display:flex;align-items:center;gap:6px;}
  select,input[type=range]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;}
  .pill{padding:3px 8px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--muted);user-select:none;}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center;padding:6px 18px;flex:0 0 auto;border-bottom:1px solid var(--line);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  /* top half: gallery, scrolls; bottom half: detail, scrolls; never overlap */
  #top{flex:1 1 0;min-height:0;overflow-y:auto;padding:10px 18px;}
  #bottom{flex:1 1 0;min-height:0;overflow:auto;padding:10px 18px;background:var(--panel);border-top:2px solid var(--accent2);}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px;cursor:pointer;border-left-width:4px;}
  .card.sel{outline:2px solid var(--accent2);} .card:hover{outline:1px solid var(--accent2);}
  .card canvas{width:100%;height:auto;image-rendering:pixelated;border-radius:3px;background:#fff;display:block;}
  .card .cap{font-size:10px;margin-top:3px;display:flex;justify-content:space-between;}
  .card .cap .b{font-weight:600;} .card .cap .f{color:var(--muted);}
  .muted{color:var(--muted);}
  #detailHead{font-size:13px;margin-bottom:8px;} #detailHead b{color:var(--ink);}
  #plots{display:flex;gap:22px;flex-wrap:wrap;}
  #plots figure{margin:0;} #plots figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;}
  #plots canvas{background:var(--panel2);border-radius:6px;display:block;cursor:crosshair;}
  #tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:5px;
       padding:4px 7px;font-size:12px;color:var(--ink);display:none;z-index:50;white-space:nowrap;}
</style>
</head>
<body>
<header><h1>Arithmetic ablation explorer</h1><span class="sub" id="hdrsub"></span></header>
<div class="controls">
  <div class="grp"><label>Gallery color</label>
    <select id="metricSel">
      <option value="kl">ablation KL</option>
      <option value="ci">causal importance</option>
      <option value="inner">inner activation</option>
    </select></div>
  <div class="grp"><label>Period</label><select id="periodSel"><option value="any">any</option></select></div>
  <div class="grp"><label>Axis</label>
    <select id="axisSel"><option value="any">any</option><option value="a">a</option><option value="b">b</option>
      <option value="sum">a+b</option><option value="diff">a−b</option></select></div>
  <div class="grp"><label>Matrices</label><span id="matToggles"></span></div>
  <div class="grp"><label>Min mean CI <span id="ciVal">0.00</span></label>
    <input type="range" id="ciSlider" min="0" max="0.3" step="0.005" value="0"></div>
  <div class="grp"><label>Sort</label>
    <select id="sortSel"><option value="max_kl">max KL</option><option value="mean_kl">mean KL</option>
      <option value="period">period</option><option value="strength">periodicity</option><option value="id">id</option></select></div>
  <div class="grp muted" id="galCount"></div>
</div>
<div class="legend" id="legend"></div>
<div id="top"><div class="gallery" id="gallery"></div></div>
<div id="bottom"><div id="detailHead" class="muted">Select a component above.</div><div id="plots"></div></div>
<div id="tip"></div>

<script src="data.js"></script>
<script>
"use strict";
if(!window.PD_DATA){
  document.body.innerHTML='<div style="padding:40px;font:15px/1.6 sans-serif;color:#e6e8ee">'
    +'<b>⚠ data.js did not load.</b><br>Keep <code>index.html</code> and <code>data.js</code> in the '
    +'same folder and open <code>index.html</code> directly (double-click / file://).</div>';
  throw new Error("PD_DATA missing");
}
const D = window.PD_DATA, M = D.meta, N = M.n;
const MATS = M.matrices, MAT_LABEL = {"mlp.gate_proj":"gate","mlp.up_proj":"up","mlp.down_proj":"down"};
const AXIS_SYM = {a:"a", b:"b", sum:"a+b", diff:"a−b"};
const STRENGTH_THR = 0.4;  // periodicity strength above which a component gets a detected base
const state = { metric:"kl", period:"any", axis:"any", mats:new Set(MATS), minCI:0, sort:"max_kl", sel:null };

// ---------- decode ----------
function bytes(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function u8(s){return bytes(s);} function i8(s){const b=bytes(s);return new Int8Array(b.buffer,b.byteOffset,b.byteLength);}
const _cache=new Map();
// normalized grid, index = a*N + b: ci/kl in [0,1], inner in [-1,1]
function grid(comp,metric){
  const k=comp.module+":"+comp.c+":"+metric;
  if(_cache.has(k)) return _cache.get(k);
  let out;
  if(metric==="ci") out=Float32Array.from(u8(comp.grids.ci),v=>v/255);
  else if(metric==="kl") out=Float32Array.from(u8(comp.grids.kl),v=>v/255);
  else out=Float32Array.from(i8(comp.grids.inner),v=>v/127);
  _cache.set(k,out); return out;
}

// ---------- color ----------
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function ramp(st,t){t=Math.max(0,Math.min(1,t));const x=t*(st.length-1),i=Math.min(st.length-2,Math.floor(x));return lerp(st[i],st[i+1],x-i).map(Math.round);}
const SEQ_PURPLE=[[255,255,255],[231,84,128],[74,20,140]];
const SEQ_HOT=[[255,255,255],[254,217,118],[252,141,89],[227,26,28],[120,0,20]];
const DIVERGE=[[33,102,172],[120,170,210],[247,247,247],[239,138,98],[178,24,43]];
const METRICS={
  ci:   {label:"causal importance", scale:1,            signed:false, fmt:v=>v.toFixed(2),       color:v=>ramp(SEQ_PURPLE,v)},
  kl:   {label:"ablation KL (nats)", scale:M.kl_scale,   signed:false, fmt:v=>v.toFixed(4),       color:v=>ramp(SEQ_HOT,v)},
  inner:{label:"inner activation",   scale:M.inner_scale, signed:true,  fmt:v=>v.toFixed(3),       color:v=>ramp(DIVERGE,(v+1)/2)},
};

// ---------- thumbnail (no axes) ----------
function drawThumb(canvas, vals, mkey, px){
  const off=drawThumb._o||(drawThumb._o=document.createElement("canvas")); off.width=N; off.height=N;
  const o=off.getContext("2d"), img=o.createImageData(N,N), col=METRICS[mkey].color;
  for(let a=0;a<N;a++) for(let b=0;b<N;b++){ const [r,g,bl]=col(vals[a*N+b]); const y=N-1-b,p=(y*N+a)*4;
    img.data[p]=r;img.data[p+1]=g;img.data[p+2]=bl;img.data[p+3]=255; }
  o.putImageData(img,0,0); canvas.width=px;canvas.height=px;
  const c=canvas.getContext("2d");c.imageSmoothingEnabled=false;c.drawImage(off,0,0,px,px);
}

// ---------- zoomed plot with axes + hover ----------
const ML=40,MT=22,MB=30,MR=12,PLOT=300, TICKS=[1,20,40,60,80,100];
function drawPlot(canvas, vals, mkey){
  const m=METRICS[mkey];
  canvas.width=ML+PLOT+MR; canvas.height=MT+PLOT+MB;
  const ctx=canvas.getContext("2d"); ctx.clearRect(0,0,canvas.width,canvas.height);
  const off=drawPlot._o||(drawPlot._o=document.createElement("canvas")); off.width=N; off.height=N;
  const o=off.getContext("2d"), img=o.createImageData(N,N);
  for(let a=0;a<N;a++) for(let b=0;b<N;b++){ const [r,g,bl]=m.color(vals[a*N+b]); const y=N-1-b,p=(y*N+a)*4;
    img.data[p]=r;img.data[p+1]=g;img.data[p+2]=bl;img.data[p+3]=255; }
  o.putImageData(img,0,0); ctx.imageSmoothingEnabled=false; ctx.drawImage(off,ML,MT,PLOT,PLOT);
  ctx.strokeStyle="#3a3f4a"; ctx.strokeRect(ML+.5,MT+.5,PLOT,PLOT);
  ctx.fillStyle="#e6e8ee"; ctx.font="12px sans-serif"; ctx.textAlign="left"; ctx.fillText(m.label, ML, 14);
  ctx.fillStyle="#9aa3b2"; ctx.font="10px sans-serif";
  TICKS.forEach(t=>{
    const x=ML+(t-1)/(N-1)*PLOT; ctx.textAlign="center"; ctx.fillText(t, x, MT+PLOT+13);
    const y=MT+(1-(t-1)/(N-1))*PLOT; ctx.textAlign="right"; ctx.fillText(t, ML-5, y+3);
  });
  ctx.textAlign="center"; ctx.fillText("a (operand 1)", ML+PLOT/2, MT+PLOT+27);
  ctx.save(); ctx.translate(11, MT+PLOT/2); ctx.rotate(-Math.PI/2); ctx.fillText("b (operand 2)",0,0); ctx.restore();
  attachHover(canvas, vals, mkey);
}
function attachHover(canvas, vals, mkey){
  const m=METRICS[mkey], tip=document.getElementById("tip");
  canvas.onmousemove=e=>{
    const dx=e.offsetX-ML, dy=e.offsetY-MT;
    if(dx<0||dy<0||dx>=PLOT||dy>=PLOT){ tip.style.display="none"; return; }
    const a=Math.min(N,Math.max(1,Math.floor(dx/PLOT*N)+1));
    const b=Math.min(N,Math.max(1,N-Math.floor(dy/PLOT*N)));
    const norm=vals[(a-1)*N+(b-1)], val=norm*m.scale;
    tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px";
    tip.innerHTML=`a=${a}, b=${b}, a+b=${a+b}<br>${m.label}: <b>${m.fmt(val)}</b>`;
  };
  canvas.onmouseleave=()=>{document.getElementById("tip").style.display="none";};
}

// ---------- gallery ----------
function detected(c){ return c.strength>=STRENGTH_THR && c.period>0 ? c : null; }
function shortMat(m){ return MAT_LABEL[m]||m; }
const PALETTE=["#7f8694","#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6","#bcf60c","#008080","#9a6324","#e6beff","#808000"];
function periodColor(p){ return p>0?PALETTE[p%PALETTE.length]:"#3a3f4a"; }

function buildControls(){
  const mt=document.getElementById("matToggles"); mt.innerHTML="";
  MATS.forEach(m=>{ const s=document.createElement("span"); s.className="pill on"; s.textContent=shortMat(m);
    s.onclick=()=>{ if(state.mats.has(m)&&state.mats.size>1){state.mats.delete(m);s.classList.remove("on");} else {state.mats.add(m);s.classList.add("on");} render(); };
    mt.appendChild(s); });
  document.getElementById("metricSel").onchange=e=>{ state.metric=e.target.value; render(); };
  document.getElementById("axisSel").onchange=e=>{ state.axis=e.target.value; render(); };
  document.getElementById("periodSel").onchange=e=>{ state.period=e.target.value; render(); };
  document.getElementById("sortSel").value=state.sort;
  document.getElementById("sortSel").onchange=e=>{ state.sort=e.target.value; render(); };
  const maxCI=Math.max(...D.components.map(c=>c.mean_ci));
  const sl=document.getElementById("ciSlider"); sl.max=(Math.ceil(maxCI*20)/20).toFixed(2);
  sl.oninput=e=>{ state.minCI=+e.target.value; document.getElementById("ciVal").textContent=(+e.target.value).toFixed(3); render(); };
}
function refreshPeriodOptions(){
  const ps=new Set(); D.components.forEach(c=>{ const d=detected(c); if(d&&state.mats.has(c.matrix)) ps.add(d.period); });
  const sel=document.getElementById("periodSel"), prev=sel.value;
  sel.innerHTML='<option value="any">any</option>';
  [...ps].sort((a,b)=>a-b).forEach(p=>{ const o=document.createElement("option"); o.value=p; o.textContent="period "+p; sel.appendChild(o); });
  sel.value=[...ps].map(String).includes(prev)?prev:"any"; state.period=sel.value;
}
function render(){
  refreshPeriodOptions();
  const items=D.components.filter(c=>{
    if(!state.mats.has(c.matrix)) return false;
    if(c.mean_ci < state.minCI) return false;
    const d=detected(c);
    if(state.axis!=="any" && (!d || c.axis!==state.axis)) return false;
    if(state.period!=="any" && (!d || d.period!=+state.period)) return false;
    return true;
  });
  const key={max_kl:c=>-c.max_kl, mean_kl:c=>-c.mean_kl, period:c=>detected(c)?c.period:1e6, strength:c=>-c.strength, id:c=>c.c}[state.sort];
  items.sort((x,y)=>{const a=key(x),b=key(y);return a<b?-1:a>b?1:0;});

  const g=document.getElementById("gallery"); g.innerHTML="";
  items.forEach(c=>{
    const card=document.createElement("div"); card.className="card"+(state.sel===c?" sel":"");
    const d=detected(c); card.style.borderLeftColor=periodColor(d?c.period:0);
    const cv=document.createElement("canvas"); card.appendChild(cv); drawThumb(cv, grid(c,state.metric), state.metric, 90);
    const cap=document.createElement("div"); cap.className="cap";
    cap.innerHTML=`<span class="b">${shortMat(c.matrix)} ${c.c}</span><span class="f">${d?d.period+" "+AXIS_SYM[c.axis]:"—"}</span>`;
    card.appendChild(cap);
    card.onclick=()=>{ g.querySelectorAll(".card.sel").forEach(el=>el.classList.remove("sel")); card.classList.add("sel"); selectComp(c); };
    g.appendChild(card);
  });
  document.getElementById("galCount").textContent=`${items.length} components`;
  buildLegend();
  if(!state.sel || !items.includes(state.sel)) selectComp(items[0]||null);
}
function buildLegend(){
  const L=document.getElementById("legend"); L.innerHTML="";
  const m=METRICS[state.metric], lab=document.createElement("span"); lab.textContent="gallery color = "+m.label+":"; L.appendChild(lab);
  const bar=document.createElement("canvas"); bar.width=110; bar.height=11; const bx=bar.getContext("2d");
  for(let i=0;i<110;i++){ const c=m.signed?m.color((i/109)*2-1):m.color(i/109); bx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`; bx.fillRect(i,0,1,11); }
  L.appendChild(bar);
  const r=document.createElement("span");
  r.textContent = state.metric==="ci"?"0 → 1" : state.metric==="kl"?`0 → ${M.kl_scale.toFixed(3)} nats`:`±${M.inner_scale.toFixed(2)}`;
  L.appendChild(r);
  const ps=new Set(); D.components.forEach(c=>{const d=detected(c); if(d&&state.mats.has(c.matrix)) ps.add(c.period);});
  if(ps.size){ const sp=document.createElement("span"); sp.style.marginLeft="10px"; sp.textContent="border = period:"; L.appendChild(sp);
    [...ps].sort((a,b)=>a-b).forEach(p=>{ const s=document.createElement("span"); s.innerHTML=`<i style="background:${periodColor(p)}"></i>${p}`; L.appendChild(s); }); }
}

// ---------- detail (bottom half): 3 zoomed plots ----------
function selectComp(c){
  state.sel=c;
  const head=document.getElementById("detailHead"), plots=document.getElementById("plots");
  if(!c){ head.textContent="No component."; plots.innerHTML=""; return; }
  const d=detected(c);
  head.innerHTML=`<b>${shortMat(c.matrix)} · component ${c.c}</b> &nbsp; `
    +`period ${d?`<b>${c.period}</b> ${AXIS_SYM[c.axis]} (str ${c.strength.toFixed(2)})`:"— (broad)"} &nbsp;·&nbsp; `
    +`mean KL ${c.mean_kl} · max KL ${c.max_kl} · ‖U‖‖V‖ ${c.norm}`;
  plots.innerHTML="";
  ["ci","kl","inner"].forEach(mk=>{ const fig=document.createElement("figure"); const cv=document.createElement("canvas");
    fig.appendChild(cv); const cap=document.createElement("figcaption"); cap.textContent=METRICS[mk].label; fig.appendChild(cap);
    plots.appendChild(fig); drawPlot(cv, grid(c,mk), mk); });
}

document.getElementById("hdrsub").textContent=`${M.run_id} · "a${M.op}b=" · ${N}×${N} · ${M.n_alive} components · KL at ${M.position}`;
buildControls();
render();
</script>
</body>
</html>
