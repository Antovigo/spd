<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Result feature construction</title>
<style>
  :root { font-family: system-ui, sans-serif; font-size: 13px; }
  body { margin: 0; background: #fafafa; color: #222; }
  #controls {
    position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd;
    padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  #controls label { display: flex; flex-direction: column; font-size: 11px; color: #666; gap: 2px; }
  #controls select, #controls input { font-size: 13px; padding: 2px 4px; }
  #title { font-weight: 600; font-size: 14px; margin-right: 8px; }
  #main { display: flex; align-items: flex-start; }
  #plotwrap { flex: 1 1 auto; overflow-x: auto; padding: 10px; }
  #grid { display: grid; gap: 4px; }
  .colcap { font-size: 11px; text-align: center; color: #444; padding: 2px 0; }
  .rowlab {
    writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px;
    color: #444; padding: 0 2px; max-height: 240px;
  }
  .cell { border: 1px solid #ddd; background: #fff; position: relative; }
  canvas { display: block; }
  .cell canvas.ov { position: absolute; left: 0; top: 0; pointer-events: none; }
  #side {
    flex: 0 0 320px; border-left: 1px solid #ddd; background: #fff; padding: 8px;
    position: sticky; top: 46px; max-height: calc(100vh - 46px); overflow-y: auto;
  }
  #side h3 { margin: 4px 0; font-size: 13px; }
  #status { font-size: 11px; color: #666; min-height: 14px; margin: 4px 0; }
  #searchrow { display: flex; gap: 4px; margin: 6px 0; }
  #search { flex: 1; font-size: 12px; padding: 2px 4px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 2px 2px; border-radius: 3px; }
  .item:hover { background: #f0f4ff; }
  .item.checked { background: #e8f0ff; }
  .item .lab { font-weight: 600; min-width: 48px; }
  .item .info { font-size: 10px; color: #777; flex: 1; }
  .item canvas { border: 1px solid #ccc; image-rendering: pixelated; }
  .grouphead { font-size: 11px; color: #555; font-weight: 600; margin: 8px 0 2px; border-bottom: 1px solid #eee; }
  #tooltip {
    position: fixed; pointer-events: none; background: rgba(0,0,0,.8); color: #fff; padding: 3px 6px;
    border-radius: 3px; font-size: 11px; display: none; z-index: 20; white-space: nowrap;
  }
  .hint { color: #888; font-size: 11px; }
  button { font-size: 11px; padding: 2px 8px; }
</style>
</head>
<body>
<div id="controls">
  <span id="title">Result feature construction</span>
  <label>colour by<select id="colorBy"><option>a</option><option>b</option><option selected>a+b</option><option value="dplane">ablation Δ (plane)</option><option value="dtotal">ablation Δ (total)</option><option value="ain">align · read dir</option><option value="ainup">align · read dir (up row)</option><option value="aout">align · write dir</option></select></label>
  <label>mod<select id="mod"></select></label>
  <label>offset<input id="offset" type="number" value="0" style="width:56px" /></label>
  <label>ablate<select id="mode"><option value="subcomponents">subcomponents</option><option value="neurons">neurons</option></select></label>
  <span class="hint" id="hint"></span>
</div>
<div id="main">
  <div id="plotwrap"><div id="grid"></div></div>
  <div id="side">
    <h3 id="sideTitle"></h3>
    <div id="status"></div>
    <div id="searchrow">
      <select id="periodFilter" title="show only subcomponents with this period"></select>
      <input id="search" placeholder="search id, e.g. g124 or 12023" />
      <button id="addBtn">select</button>
      <button id="clearBtn">clear</button>
    </div>
    <div id="items"></div>
  </div>
</div>
<div id="tooltip"></div>

<script src="data.js"></script>
<script>
"use strict";
const D = window.PD_DATA;
const N = D.meta.n, NP = N * N, P = D.meta.periods.length, P2 = 2 * P;

// ---- fp16 decode via a 65536-entry lookup table (fast enough for the multi-MB payloads) ----
const F16_TABLE = (() => {
  const t = new Float32Array(65536);
  for (let u = 0; u < 65536; u++) {
    const s = (u & 0x8000) >> 15, e = (u & 0x7c00) >> 10, f = u & 0x03ff;
    t[u] = e === 0 ? (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024)
      : e === 31 ? (f ? NaN : (s ? -Infinity : Infinity))
      : (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  return t;
})();
function decodeF16(b64) {
  const bin = atob(b64), len = bin.length >> 1, out = new Float32Array(len);
  for (let i = 0; i < len; i++) out[i] = F16_TABLE[bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8)];
  return out;
}
const _cache = {};
function arr(key) { if (!(key in _cache)) _cache[key] = decodeF16(D[key]); return _cache[key]; }

// ---- colour map ----------------------------------------------------------------------------
const _VIRIDIS = [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]];
function viridis(t) {
  t = Math.max(0, Math.min(1, t));
  const x = t * (_VIRIDIS.length - 1), i = Math.min(_VIRIDIS.length - 2, Math.floor(x)), f = x - i;
  const a = _VIRIDIS[i], b = _VIRIDIS[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
}

const el = id => document.getElementById(id);
const tooltip = el("tooltip");
const aOf = t => Math.floor(t / N) + 1, bOf = t => (t % N) + 1;

// ---- selection state: one ablated item at a time ---------------------------------------------
let MODE = "subcomponents";
let SELECTED_ID = null;   // a neuron id (number) or subcomp id ("g124"), or null
const SIZE = 240;

// ---- colour --------------------------------------------------------------------------------
// The delta modes colour every row by the prompt's original→ablated displacement in the probe
// frame: `dplane` = the 2D move in the current column's plane, `dtotal` = the norm over all
// planes. The align modes colour by the dot of the activation with the selected item's unit
// read/write direction (signed, diverging map): read = x·V̂ (gate/up; down uses h·V̂) or the
// neuron's normalized gate/up preactivation; write = the gate/up preactivation onto Û, or the
// post residual onto Û / the neuron's down column. NaN (no selection / N/A) renders grey.
function colorInfo() {
  const cb = el("colorBy").value, m = +el("mod").value, off = +el("offset").value || 0;
  if (cb === "dplane" || cb === "dtotal") {
    if (!DELTA) return { f: () => NaN, val: () => NaN };
    const dd = deltaDistances();
    if (cb === "dplane") return {
      f: (t, col) => dd.plane[t * P + col] / dd.hiPlane,
      val: (t, col) => dd.plane[t * P + col],
    };
    return { f: t => dd.total[t] / dd.hiTotal, val: t => dd.total[t] };
  }
  if (cb === "ain" || cb === "ainup" || cb === "aout") {
    let g = null;
    if (SELECTED_ID !== null && MODE === "neurons") {
      const i = D.neurons.findIndex(nr => nr.id === SELECTED_ID);
      const key = cb === "ain" ? "align_in_g" : cb === "ainup" ? "align_in_u" : "align_out_d";
      g = arr(key).subarray(i * NP, (i + 1) * NP);
    } else if (SELECTED_ID !== null && cb !== "ainup") {  // the up-row read is neuron-only
      const i = D.subcomps.findIndex(c => c.id === SELECTED_ID);
      g = arr(cb === "ain" ? "align_in_sub" : "align_out_sub").subarray(i * NP, (i + 1) * NP);
    }
    if (!g) return { f: () => NaN, val: () => NaN };
    const abs = [...g].map(Math.abs).sort((a, b) => a - b);
    const hi = abs[Math.floor(abs.length * 0.99)] || 1;
    return { f: t => g[t] / hi, val: t => g[t], signed: true };
  }
  const f = cb === "a" ? aOf : cb === "b" ? bOf : (t => aOf(t) + bOf(t));
  if (m <= 1) {
    const lo = cb === "a+b" ? 2 : 1, hi = cb === "a+b" ? 2 * N : N;
    return { f: t => (f(t) - lo) / (hi - lo), raw: f, label: [lo, hi] };
  }
  return { f: t => ((((f(t) - off) % m) + m) % m) / Math.max(m - 1, 1), raw: f, label: [0, m - 1] };
}

// signed diverging map for the align modes: blue (−1) → light grey (0) → red (+1); the grey
// midpoint keeps near-zero points visible on the white background
function rdbu(t) {
  t = Math.max(-1, Math.min(1, t));
  const mid = [214, 214, 214], neg = [42, 76, 192], pos = [186, 24, 38];
  const c = t < 0 ? neg : pos, a = Math.abs(t);
  return `rgb(${Math.round(mid[0] + (c[0] - mid[0]) * a)},${Math.round(mid[1] + (c[1] - mid[1]) * a)},${Math.round(mid[2] + (c[2] - mid[2]) * a)})`;
}

// per-prompt displacement magnitudes of the current DELTA, per plane and overall; scales are
// the 99th percentile so one outlier prompt doesn't wash the map out
let DELTA_DIST = null;
function deltaDistances() {
  if (DELTA_DIST) return DELTA_DIST;
  const plane = new Float32Array(NP * P);
  const total = new Float32Array(NP);
  for (let t = 0; t < NP; t++) {
    let tot = 0;
    for (let j = 0; j < P; j++) {
      const dx = DELTA[t * P2 + 2 * j], dy = DELTA[t * P2 + 2 * j + 1];
      plane[t * P + j] = Math.hypot(dx, dy);
      tot += dx * dx + dy * dy;
    }
    total[t] = Math.sqrt(tot);
  }
  const q99 = a => {
    const v = [...a].sort((x, y) => x - y);
    return v[Math.floor(v.length * 0.99)] || 1;
  };
  DELTA_DIST = { plane, total, hiPlane: q99(plane), hiTotal: q99(total) };
  return DELTA_DIST;
}
function setDelta(d) { DELTA = d; DELTA_DIST = null; }
// colour modes that depend on the current selection (delta displacement / alignment)
function selectionColorMode() {
  return ["dplane", "dtotal", "ain", "ainup", "aout"].includes(el("colorBy").value);
}
// the ablated row always redraws; selection-keyed colouring repaints every row
function refreshAfterDelta() { if (selectionColorMode()) recolor(); else drawRow(3); }

// ---- ablation-direction arrows ---------------------------------------------------------------
// The ablated item's read direction (gate/up subcomp V, neuron gate + up rows) drawn on row 0's
// pre frame; its write direction (down subcomp U, neuron down column) on row 1's post frame.
// Unit residual directions go through the same linear map as the points (v̂·W per plane), so
// arrow lengths compare across periods; display is scaled per row so the longest arrow spans
// 0.9 of the unit ring (raw ‖proj‖ in the tooltip).
const ARROWS = { 0: [], 1: [], scale: { 0: 1, 1: 1 } };
function refreshArrows() {
  for (const row of [0, 1]) {
    const list = [];
    if (SELECTED_ID !== null && MODE === "neurons") {
      const i = D.neurons.findIndex(nr => nr.id === SELECTED_ID);
      if (row === 0) {
        list.push({ label: `${SELECTED_ID} gate read`, p: arr("neuron_arrow_g").subarray(i * P2, (i + 1) * P2) });
        list.push({ label: `${SELECTED_ID} up read`, p: arr("neuron_arrow_u").subarray(i * P2, (i + 1) * P2) });
      } else {
        list.push({ label: `${SELECTED_ID} down write`, p: arr("neuron_arrow_d").subarray(i * P2, (i + 1) * P2) });
      }
    } else if (SELECTED_ID !== null) {
      const i = D.subcomps.findIndex(c => c.id === SELECTED_ID);
      const c = D.subcomps[i];
      if ((c.proj === "d") === (row === 1)) {
        list.push({ label: `${c.id} ${row ? "write" : "read"}`, p: arr("sub_arrow").subarray(i * P2, (i + 1) * P2) });
      }
    }
    let mx = 0;
    for (const a of list) for (let j = 0; j < P; j++) mx = Math.max(mx, Math.hypot(a.p[2 * j], a.p[2 * j + 1]));
    ARROWS[row] = list;
    ARROWS.scale[row] = mx > 0 ? 0.9 / mx : 1;
  }
}

// ---- plots ---------------------------------------------------------------------------------
// Five fixed rows: which activation cloud, on which probe frame; row 3 applies the ablation
// delta; row 4 is the alive-components-only MLP (binary mask, delta off), computed at build
// time. One view per column, shared by all rows so correspondences read directly.
const ROWS = [
  { label: `pre-MLP acts · pre probes`, cloud: "proj_pre_on_pre", abl: false },
  { label: `pre-MLP acts · post probes`, cloud: "proj_pre_on_post", abl: false },
  { label: `post-MLP acts · post probes`, cloud: "proj_post_on_post", abl: false },
  { label: `post-MLP, ablated`, cloud: "proj_post_on_post", abl: true },
  { label: `alive-comps MLP (no Δ) · post probes`, cloud: "proj_circuit_on_post", abl: false },
];
let views = [];   // per column {k, cx, cy}
let cells = [];   // [row][col] -> {canvas, ctx, ov, octx}

// ablation result: null = nothing ablated (row 3 mirrors row 2); Float32Array [NP*P2]
let DELTA = null;

function rowPoints(row) {
  const r = ROWS[row];
  const proj = arr(r.cloud);
  if (r.abl && DELTA) return { proj, delta: DELTA };
  return { proj };
}

function initViews() {
  views = [];
  const clouds = [...new Set(ROWS.map(r => r.cloud))].map(arr);
  for (let j = 0; j < P; j++) {
    let lo0 = Infinity, hi0 = -Infinity, lo1 = Infinity, hi1 = -Infinity;
    for (const proj of clouds) {
      for (let t = 0; t < NP; t++) {
        const x = proj[t * P2 + 2 * j], y = proj[t * P2 + 2 * j + 1];
        if (x < lo0) lo0 = x; if (x > hi0) hi0 = x;
        if (y < lo1) lo1 = y; if (y > hi1) hi1 = y;
      }
    }
    const ext = Math.max(hi0 - lo0, hi1 - lo1, 1e-6);
    views.push({ k: (SIZE * 0.92) / ext, cx: (lo0 + hi0) / 2, cy: (lo1 + hi1) / 2 });
  }
}

function toScreen(v, x, y) { return [SIZE / 2 + (x - v.cx) * v.k, SIZE / 2 - (y - v.cy) * v.k]; }
function fromScreen(v, px, py) { return [v.cx + (px - SIZE / 2) / v.k, v.cy - (py - SIZE / 2) / v.k]; }

function drawCell(row, col) {
  const { ctx } = cells[row][col], v = views[col], color = COLOR;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const o = toScreen(v, 0, 0);
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(o[0], 0); ctx.lineTo(o[0], SIZE); ctx.moveTo(0, o[1]); ctx.lineTo(SIZE, o[1]); ctx.stroke();
  const rp = rowPoints(row);
  for (let t = 0; t < NP; t++) {
    let x = rp.proj[t * P2 + 2 * col], y = rp.proj[t * P2 + 2 * col + 1];
    if (rp.delta) { x += rp.delta[t * P2 + 2 * col]; y += rp.delta[t * P2 + 2 * col + 1]; }
    const s = toScreen(v, x, y);
    if (s[0] < -3 || s[0] > SIZE + 3 || s[1] < -3 || s[1] > SIZE + 3) continue;
    const cv = color.f(t, col);
    ctx.fillStyle = !Number.isFinite(cv) ? "#ccc" : color.signed ? rdbu(cv) : viridis(cv);
    ctx.fillRect(s[0] - 0.8, s[1] - 0.8, 1.6, 1.6);
  }
  // unit circle of the probe's predicted (cos, sin) — a perfect feature traces it
  const c0 = toScreen(v, 0, 0);
  ctx.strokeStyle = "rgba(200,60,60,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(c0[0], c0[1], v.k, 0, 2 * Math.PI); ctx.stroke();

  // read/write direction arrow of the ablated item (rows 0 and 1 only)
  const arrows = ARROWS[row];
  if (arrows && arrows.length) {
    const k = ARROWS.scale[row];
    ctx.strokeStyle = ctx.fillStyle = "#ff2020"; ctx.lineWidth = 2;
    for (const a of arrows) {
      const e = toScreen(v, a.p[2 * col] * k, a.p[2 * col + 1] * k);
      ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(e[0], e[1]); ctx.stroke();
      const ang = Math.atan2(e[1] - o[1], e[0] - o[0]), hl = 9, hw = 0.5;
      ctx.beginPath(); ctx.moveTo(e[0], e[1]);
      ctx.lineTo(e[0] - hl * Math.cos(ang - hw), e[1] - hl * Math.sin(ang - hw));
      ctx.lineTo(e[0] - hl * Math.cos(ang + hw), e[1] - hl * Math.sin(ang + hw));
      ctx.closePath(); ctx.fill();
    }
  }
}

function arrowAt(row, col, px, py) {
  const list = ARROWS[row];
  if (!list || !list.length) return null;
  const v = views[col], k = ARROWS.scale[row];
  let best = null, bestd = 9;
  for (const a of list) {
    const e = toScreen(v, a.p[2 * col] * k, a.p[2 * col + 1] * k);
    const d = Math.hypot(e[0] - px, e[1] - py);
    if (d < bestd) { bestd = d; best = a; }
  }
  return best;
}

function drawColumn(col) { for (let r = 0; r < ROWS.length; r++) drawCell(r, col); }
function drawAll() { for (let c = 0; c < P; c++) drawColumn(c); drawHighlight(); }
function drawRow(row) { for (let c = 0; c < P; c++) drawCell(row, c); drawHighlight(); }

let COLOR = null;
const _SEL_HINT = "select an item to colour by Δ / alignment";
function recolor() {
  COLOR = colorInfo();
  if (selectionColorMode() && SELECTED_ID === null) setStatus(_SEL_HINT);
  else if (el("status").textContent === _SEL_HINT) setStatus("");
  drawAll();
}

// ---- hover highlight: the same prompt marked in every plot ----------------------------------
// Overlay canvases so a hover doesn't repaint 10k points per cell.
let HOVER_T = -1;
function drawHighlight() {
  for (let r = 0; r < ROWS.length; r++) {
    const rp = HOVER_T >= 0 ? rowPoints(r) : null;
    for (let c = 0; c < P; c++) {
      const g = cells[r][c].octx;
      g.clearRect(0, 0, SIZE, SIZE);
      if (HOVER_T < 0) continue;
      let x = rp.proj[HOVER_T * P2 + 2 * c], y = rp.proj[HOVER_T * P2 + 2 * c + 1];
      if (rp.delta) { x += rp.delta[HOVER_T * P2 + 2 * c]; y += rp.delta[HOVER_T * P2 + 2 * c + 1]; }
      const s = toScreen(views[c], x, y);
      if (s[0] < -8 || s[0] > SIZE + 8 || s[1] < -8 || s[1] > SIZE + 8) continue;
      g.strokeStyle = "#fff"; g.lineWidth = 3.5;
      g.beginPath(); g.arc(s[0], s[1], 5.5, 0, 2 * Math.PI); g.stroke();
      g.strokeStyle = "#000"; g.lineWidth = 1.8;
      g.beginPath(); g.arc(s[0], s[1], 5.5, 0, 2 * Math.PI); g.stroke();
    }
  }
}

function buildGrid() {
  const grid = el("grid");
  grid.style.gridTemplateColumns = `18px repeat(${P}, ${SIZE + 2}px)`;
  grid.innerHTML = "";
  grid.appendChild(document.createElement("div"));
  D.meta.periods.forEach((t, j) => {
    const cap = document.createElement("div"); cap.className = "colcap";
    cap.textContent = `T=${t} · r² post ${D.meta.r2.post[j].toFixed(2)} · pre ${D.meta.r2.pre[j].toFixed(2)}`;
    grid.appendChild(cap);
  });
  cells = [];
  for (let r = 0; r < ROWS.length; r++) {
    const lab = document.createElement("div"); lab.className = "rowlab"; lab.textContent = ROWS[r].label;
    grid.appendChild(lab);
    cells.push([]);
    for (let c = 0; c < P; c++) {
      const cell = document.createElement("div"); cell.className = "cell";
      const canvas = document.createElement("canvas"); canvas.width = SIZE; canvas.height = SIZE;
      const ov = document.createElement("canvas"); ov.width = SIZE; ov.height = SIZE; ov.className = "ov";
      cell.appendChild(canvas); cell.appendChild(ov); grid.appendChild(cell);
      cells[r].push({ canvas, ctx: canvas.getContext("2d"), ov, octx: ov.getContext("2d") });
      attachInteraction(canvas, r, c);
    }
  }
}

function attachInteraction(canvas, row, col) {
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault();
    const v = views[col];
    const before = fromScreen(v, ev.offsetX, ev.offsetY);
    v.k *= Math.exp(-ev.deltaY * 0.0015);
    const after = fromScreen(v, ev.offsetX, ev.offsetY);
    v.cx += before[0] - after[0]; v.cy += before[1] - after[1];
    drawColumn(col); drawHighlight();
  }, { passive: false });
  let drag = null;
  canvas.addEventListener("mousedown", ev => { drag = { x: ev.offsetX, y: ev.offsetY, cx: views[col].cx, cy: views[col].cy }; });
  window.addEventListener("mouseup", () => { drag = null; });
  canvas.addEventListener("mousemove", ev => {
    if (drag) {
      views[col].cx = drag.cx - (ev.offsetX - drag.x) / views[col].k;
      views[col].cy = drag.cy + (ev.offsetY - drag.y) / views[col].k;
      drawColumn(col); drawHighlight(); return;
    }
    const ah = row <= 1 ? arrowAt(row, col, ev.offsetX, ev.offsetY) : null;
    if (ah) {
      if (HOVER_T !== -1) { HOVER_T = -1; drawHighlight(); }
      tooltip.style.display = "block";
      tooltip.style.left = (ev.clientX + 10) + "px"; tooltip.style.top = (ev.clientY + 10) + "px";
      tooltip.textContent = `${ah.label} · ‖proj‖ ${Math.hypot(ah.p[2 * col], ah.p[2 * col + 1]).toFixed(3)}`;
      return;
    }
    const t = pointAt(row, col, ev.offsetX, ev.offsetY);
    if (t !== HOVER_T) { HOVER_T = t; drawHighlight(); }
    if (t >= 0) {
      tooltip.style.display = "block";
      tooltip.style.left = (ev.clientX + 10) + "px"; tooltip.style.top = (ev.clientY + 10) + "px";
      const dv = COLOR.val ? COLOR.val(t, col) : null;
      tooltip.textContent = `${aOf(t)}+${bOf(t)}=${aOf(t) + bOf(t)}`
        + (dv !== null && Number.isFinite(dv) ? ` · Δ ${dv.toFixed(3)}` : "");
    } else tooltip.style.display = "none";
  });
  canvas.addEventListener("mouseleave", () => {
    tooltip.style.display = "none";
    if (HOVER_T !== -1) { HOVER_T = -1; drawHighlight(); }
  });
}

function pointAt(row, col, px, py) {
  const v = views[col], rp = rowPoints(row);
  let best = -1, bestd = 6;
  for (let t = 0; t < NP; t++) {
    let x = rp.proj[t * P2 + 2 * col], y = rp.proj[t * P2 + 2 * col + 1];
    if (rp.delta) { x += rp.delta[t * P2 + 2 * col]; y += rp.delta[t * P2 + 2 * col + 1]; }
    const s = toScreen(v, x, y);
    const dd = Math.hypot(s[0] - px, s[1] - py);
    if (dd < bestd) { bestd = dd; best = t; }
  }
  return best;
}

// ---- side panel ----------------------------------------------------------------------------
function thumb(grid, stride) {
  // signed RdBu thumbnail of a [N,N] grid (row-major a*N+b), origin lower-left, a on x
  const side = Math.ceil(N / stride);
  const cv = document.createElement("canvas"); cv.width = side; cv.height = side;
  cv.style.width = "44px"; cv.style.height = "44px";
  let lim = 1e-9;
  for (let i = 0; i < grid.length; i++) { const v = Math.abs(grid[i]); if (v > lim) lim = v; }
  const ctx = cv.getContext("2d"), img = ctx.createImageData(side, side);
  for (let a = 0; a < side; a++) for (let b = 0; b < side; b++) {
    const v = grid[(a * stride) * N + (b * stride)] / lim;
    const t = Math.max(-1, Math.min(1, v));
    const idx = ((side - 1 - b) * side + a) * 4;
    let r, g, bl;
    if (t >= 0) { r = 255; g = Math.round(255 - t * 255); bl = g; } else { r = Math.round(255 + t * 255); g = r; bl = 255; }
    img.data[idx] = r; img.data[idx + 1] = g; img.data[idx + 2] = bl; img.data[idx + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function itemRow(id, label, info, gridFn) {
  const row = document.createElement("div"); row.className = "item"; row.dataset.id = String(id);
  const cb = document.createElement("input"); cb.type = "checkbox";
  cb.checked = SELECTED_ID === id;
  cb.addEventListener("change", () => { select(cb.checked ? id : null); });
  const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = label;
  const inf = document.createElement("span"); inf.className = "info"; inf.textContent = info;
  row.appendChild(cb); row.appendChild(lab); row.appendChild(inf);
  row.appendChild(thumb(gridFn(), 2));
  return row;
}

// ---- period filter (subcomponents only): hide items whose period label doesn't match --------
const SUB_PERIOD = {};  // id -> period label
function periodKey(lbl) {
  if (lbl.startsWith("period ")) return [0, parseFloat(lbl.slice(7))];
  if (lbl.startsWith("×")) return [1, parseFloat(lbl.slice(1))];
  if (lbl === "no period") return [2, 0];
  return [3, 0];
}
function populatePeriodFilter() {
  D.subcomps.forEach(c => { SUB_PERIOD[c.id] = c.period; });
  const sel = el("periodFilter");
  sel.innerHTML = '<option value="">all periods</option>';
  const vals = [...new Set(D.subcomps.map(c => c.period))]
    .sort((a, b) => { const ka = periodKey(a), kb = periodKey(b); return ka[0] - kb[0] || ka[1] - kb[1]; });
  for (const v of vals) {
    const o = document.createElement("option"); o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
}
function applyPeriodFilter() {
  const v = MODE === "subcomponents" ? el("periodFilter").value : "";
  let header = null, headerHasVisible = false;
  for (const row of el("items").children) {
    if (row.classList.contains("grouphead")) {
      if (header) header.style.display = headerHasVisible ? "" : "none";
      header = row; headerHasVisible = false;
      continue;
    }
    const show = !v || SUB_PERIOD[row.dataset.id] === v;
    row.style.display = show ? "" : "none";
    if (show) headerHasVisible = true;
  }
  if (header) header.style.display = headerHasVisible ? "" : "none";
}

function buildSide() {
  el("sideTitle").textContent = MODE === "neurons"
    ? `neurons (measured ablation max KL > ${D.meta.kl_thr})`
    : `alive subcomponents (last-token CI reaches ${D.meta.last_ci_thr ?? "?"})`;
  el("periodFilter").style.display = MODE === "neurons" ? "none" : "";
  const box = el("items"); box.innerHTML = "";
  if (MODE === "neurons") {
    const acts = arr("neuron_act");
    D.neurons.forEach((nrec, i) => {
      box.appendChild(itemRow(nrec.id, String(nrec.id), `KL ${nrec.kl}`,
        () => acts.subarray(i * NP, (i + 1) * NP)));
    });
  } else {
    const inner = arr("sub_inner");
    let lastProj = "";
    D.subcomps.forEach((c, i) => {
      if (c.proj !== lastProj) {
        lastProj = c.proj;
        const head = document.createElement("div"); head.className = "grouphead";
        head.textContent = { g: "gate", u: "up", d: "down" }[c.proj];
        box.appendChild(head);
      }
      box.appendChild(itemRow(c.id, c.id, `CI ${c.ci} · ${c.period}`,
        () => inner.subarray(i * NP, (i + 1) * NP)));
    });
  }
  applyPeriodFilter();
}

// Single-selection: picking an item replaces any previous pick.
function select(id) {
  SELECTED_ID = id;
  for (const row of el("items").children) {
    if (!row.dataset || !row.dataset.id) continue;
    const on = String(id) === row.dataset.id;
    row.classList.toggle("checked", on);
    const cb = row.querySelector("input"); if (cb) cb.checked = on;
  }
  recomputeDelta();
}

// ---- ablation math: one item, exact on the full grid ----------------------------------------
function recomputeDelta() {
  refreshArrows(); drawRow(0); drawRow(1);  // direction arrows track the selection immediately
  if (SELECTED_ID === null) { setDelta(null); setStatus(""); refreshAfterDelta(); return; }
  const out = new Float32Array(NP * P2);
  if (MODE === "neurons") {
    const i = D.neurons.findIndex(nr => nr.id === SELECTED_ID);
    const a = arr("neuron_act").subarray(i * NP, (i + 1) * NP);
    const w = arr("neuron_wd").subarray(i * P2, (i + 1) * P2);
    for (let t = 0; t < NP; t++) {
      const av = a[t], base = t * P2;
      for (let p = 0; p < P2; p++) out[base + p] -= av * w[p];
    }
    setDelta(out);
    setStatus(`neuron ${SELECTED_ID} ablated — exact, full grid.`);
    refreshAfterDelta(); return;
  }
  const i = D.subcomps.findIndex(c => c.id === SELECTED_ID);
  const c = D.subcomps[i];
  if (c.proj === "d") {
    const nGu = D.subcomps.filter(s => s.proj !== "d").length;
    const grid = arr("sub_inner").subarray(i * NP, (i + 1) * NP);
    const w = arr("down_wu").subarray((i - nGu) * P2, (i - nGu + 1) * P2);
    for (let t = 0; t < NP; t++) {
      const iv = grid[t], base = t * P2;
      for (let p = 0; p < P2; p++) out[base + p] -= iv * w[p];
    }
    setDelta(out);
  } else {
    setDelta(arr("gu_exact_delta").slice(i * NP * P2, (i + 1) * NP * P2));
  }
  setStatus(`${c.id} ablated — exact, full grid.`);
  refreshAfterDelta();
}
function setStatus(s) { el("status").textContent = s; }

// ---- search --------------------------------------------------------------------------------
function doSearch() {
  const q = el("search").value.trim();
  if (!q) return;
  let id = null;
  if (MODE === "neurons") {
    const num = parseInt(q, 10);
    if (D.neurons.some(nr => nr.id === num)) id = num;
    else { setStatus(`neuron ${q} is not in the causal set (max KL ≤ ${D.meta.kl_thr} or unmeasured)`); return; }
  } else {
    if (D.subcomps.some(c => c.id === q)) id = q;
    else { setStatus(`subcomponent ${q} is not in the alive set`); return; }
  }
  select(id);
  // a filtered-out hit resets the period filter so the row is visible to scroll to
  if (MODE === "subcomponents" && el("periodFilter").value
      && SUB_PERIOD[id] !== el("periodFilter").value) {
    el("periodFilter").value = "";
    applyPeriodFilter();
  }
  for (const row of el("items").children) {
    if (row.dataset && row.dataset.id === String(id)) row.scrollIntoView({ block: "center" });
  }
  el("search").value = "";
}

// ---- wire ----------------------------------------------------------------------------------
function populateMods() {
  const sel = el("mod");
  sel.innerHTML = '<option value="1">none</option>';
  for (const v of D.meta.mods) {
    const o = document.createElement("option"); o.value = v; o.textContent = "mod " + v;
    sel.appendChild(o);
  }
}
el("mode").addEventListener("change", () => {
  MODE = el("mode").value;
  SELECTED_ID = null;
  buildSide(); recomputeDelta();
});
["colorBy", "mod"].forEach(id => el(id).addEventListener("change", recolor));
el("offset").addEventListener("input", recolor);
el("periodFilter").addEventListener("change", applyPeriodFilter);
el("addBtn").addEventListener("click", doSearch);
el("search").addEventListener("keydown", ev => { if (ev.key === "Enter") doSearch(); });
el("clearBtn").addEventListener("click", () => { select(null); });

el("hint").textContent = `${D.meta.run} · L${D.meta.layer} · a+b probes on the residual stream `
  + `(rows: pre/post/circuit activations × pre/post probes) · ${N}×${N} grid · red ring = predicted `
  + `unit circle · hover a point to mark its prompt everywhere · red arrows = ablated item's read `
  + `(row 1) / write (row 2) directions · one ablation at a time, always exact on the full grid`;
populateMods();
populatePeriodFilter();
buildGrid();
initViews();
COLOR = colorInfo();
drawAll();
buildSide();
</script>
</body>
