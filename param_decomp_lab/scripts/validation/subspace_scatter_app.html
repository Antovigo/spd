<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Subspace scatter</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #fff; color: #222; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 10px 0 0; }
  label { font-size: 13px; }
  select { font-size: 13px; padding: 2px 4px; }
  #wrap { display: flex; }
  #scatter { flex: 1; min-width: 0; height: calc(100vh - 52px); }
  #panel { width: 600px; border-left: 1px solid #ddd; overflow-y: auto; height: calc(100vh - 52px); padding: 8px; box-sizing: border-box; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .task-section { width: 100%; font-size: 14px; font-weight: 700; color: #222; border-top: 2px solid #888; padding: 10px 2px 2px; margin-top: 8px; text-transform: capitalize; }
  .section { width: 100%; font-size: 12px; font-weight: 600; color: #777; padding: 4px 2px 2px; }
  .card { width: 132px; cursor: pointer; border: 2px solid transparent; border-radius: 4px; padding: 2px; text-align: center; box-sizing: border-box; }
  .card:hover { background: #f3f3f3; }
  .card.sel { border-color: #d62728; background: #fdeaea; }
  .card img { width: 128px; height: 128px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .card span { font-size: 12px; }
  #hint { font-size: 12px; color: #888; }
</style>
<script>/*__PLOTLY_JS__*/</script>
</head>
<body>
<header>
  <h1>Subspace scatter</h1>
  <label>side <select id="side"><option value="input">input</option><option value="output">output</option></select></label>
  <label>colour <select id="color"><option value="task">task</option><option value="a">a</option><option value="b">b</option></select></label>
  <label>mod <select id="mod"><option value="1">none</option><option value="2">2</option><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></label>
  <span id="hint"></span>
</header>
<div id="wrap">
  <div id="scatter"></div>
  <div id="panel"><div class="grid" id="grid"></div></div>
</div>
<script>window.PD_DATA = /*__PD_DATA__*/;</script>
<script>
const D = window.PD_DATA, META = D.meta, N = META.point_task.length;
const elSide = document.getElementById("side"), elColor = document.getElementById("color");
const elMod = document.getElementById("mod");
const grid = document.getElementById("grid"), hint = document.getElementById("hint");
let selected = [];  // direction indices for the current side, in pick order, max 3

const curSide = () => D.sides[elSide.value];
function colorArr() {
  if (elColor.value === "task") return META.point_task;
  const base = { a: META.a, b: META.b }[elColor.value], m = +elMod.value;
  return m > 1 ? base.map(v => v % m) : base;
}
const colorLabel = () => elColor.value === "task" ? "task" : elColor.value + (+elMod.value > 1 ? " mod " + elMod.value : "");

// Cholesky of a k×k Gram (k≤3): lower-triangular L with L Lᵀ = G, so its rows are unit
// vectors at the directions' true mutual angles.
function cholesky(G) {
  const k = G.length, L = Array.from({ length: k }, () => new Array(k).fill(0));
  for (let i = 0; i < k; i++)
    for (let j = 0; j <= i; j++) {
      let sum = G[i][j];
      for (let m = 0; m < j; m++) sum -= L[i][m] * L[j][m];
      L[i][j] = i === j ? Math.sqrt(Math.max(sum, 1e-9)) : sum / L[j][j];
    }
  return L;
}
// Solve L P = s for P (forward substitution) — the point with inner products s along the axes.
function forwardSolve(L, s) {
  const k = L.length, P = new Array(k);
  for (let i = 0; i < k; i++) {
    let v = s[i];
    for (let m = 0; m < i; m++) v -= L[i][m] * P[m];
    P[i] = v / L[i][i];
  }
  return P;
}

function renderList() {
  grid.innerHTML = "";
  let lastTask = null, lastPeriod;
  curSide().picks.forEach(p => {
    if (p.task !== lastTask) {
      lastTask = p.task; lastPeriod = undefined;
      const h = document.createElement("div"); h.className = "task-section"; h.textContent = p.task; grid.appendChild(h);
    }
    if (p.period !== lastPeriod) {
      lastPeriod = p.period;
      const s = document.createElement("div"); s.className = "section";
      s.textContent = p.period == null ? "no period" : "period " + p.period;
      grid.appendChild(s);
    }
    const card = document.createElement("div");
    card.className = "card" + (selected.includes(p.dir) ? " sel" : "");
    card.innerHTML = `<img src="${p.thumb}" alt=""><span>${p.label}</span>`;
    card.onclick = () => toggle(p.dir);
    grid.appendChild(card);
  });
}

function toggle(dir) {
  const at = selected.indexOf(dir);
  if (at >= 0) selected.splice(at, 1);
  else if (selected.length < 3) selected.push(dir);
  else return;  // already 3 picked — deselect one first
  renderList();
  drawScatter();
}

// Embed each point so its projection onto each picked direction equals that inner activation,
// with the directions kept at their real angles (Cholesky of the picked sub-Gram).
function geometry() {
  const dp = curSide().dir_proj, gram = curSide().gram;
  const L = cholesky(selected.map(i => selected.map(j => gram[i][j])));
  const X = new Array(N), Y = new Array(N), Z = new Array(N);
  let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity, zmin = Infinity, zmax = -Infinity;
  for (let p = 0; p < N; p++) {
    const P = forwardSolve(L, selected.map(d => dp[d][p]));
    const x = P[0] || 0, y = P[1] || 0, z = P[2] || 0;
    X[p] = x; Y[p] = y; Z[p] = z;
    if (x < xmin) xmin = x; if (x > xmax) xmax = x;
    if (y < ymin) ymin = y; if (y > ymax) ymax = y;
    if (z < zmin) zmin = z; if (z > zmax) zmax = z;
  }
  const range = Math.max(xmax - xmin, ymax - ymin, zmax - zmin, 1e-6);
  return { X, Y, Z, L, floorZ: zmin, arrowLen: 0.75 * range };  // arrows ≈ ¾ the data range
}

function drawScatter() {
  const k = selected.length, dirLabel = curSide().dir_label;
  const labels = selected.map(d => dirLabel[d]);
  hint.textContent = `${k}/3 picked${labels.length ? ": " + labels.join(", ") : " — pick subcomponents on the right"}`;
  const gd = document.getElementById("scatter");
  if (k === 0) { Plotly.react("scatter", [], {}); return; }

  const { X, Y, Z, L, floorZ, arrowLen } = geometry();
  const cb = { title: colorLabel(), thickness: 12 };
  if (elColor.value === "task") { cb.tickmode = "array"; cb.tickvals = META.tasks.map((_, i) => i); cb.ticktext = META.tasks; }
  const shadow = {
    type: "scatter3d", mode: "markers", x: X, y: Y, z: Z.map(() => floorZ),
    marker: { size: 2, color: "#555", opacity: 0.3 }, hoverinfo: "skip", showlegend: false,
  };
  const trace = {
    type: "scatter3d", mode: "markers", x: X, y: Y, z: Z,
    marker: { size: 2.5, color: colorArr(), colorscale: "Viridis", showscale: true, colorbar: cb },
    hoverinfo: "skip",
  };
  const axisTraces = selected.map((d, i) => {
    const f = [0, 0, 0];
    for (let m = 0; m <= i; m++) f[m] = L[i][m];
    return {
      type: "scatter3d", mode: "lines+text",
      x: [0, arrowLen * f[0]], y: [0, arrowLen * f[1]], z: [0, arrowLen * f[2]],
      line: { color: "#d62728", width: 3 }, text: ["", dirLabel[d]],
      textposition: "top center", textfont: { size: 13, color: "#d62728" }, hoverinfo: "skip", showlegend: false,
    };
  });
  // aspectmode "data" keeps equal scale on every axis; re-passing the current camera keeps the
  // view fixed across colour/mod/pick changes.
  const scene = { aspectmode: "data", xaxis: { title: "" }, yaxis: { title: "" }, zaxis: { title: "" } };
  const cam = gd._fullLayout && gd._fullLayout.scene && gd._fullLayout.scene.camera;
  if (cam) scene.camera = cam;
  Plotly.react("scatter", [shadow, trace, ...axisTraces], { margin: { l: 0, r: 0, t: 10, b: 0 }, scene }, { responsive: true });
}

elSide.onchange = () => { selected = []; renderList(); drawScatter(); };
elColor.onchange = drawScatter;
elMod.onchange = drawScatter;
if (META.tasks.length < 2) elColor.value = "a";  // task colour is uniform with a single task
renderList();
drawScatter();
</script>
</body>
</html>
