<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Direction scatter — neuron / subcomponent directions on the Fourier plane</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 10px; color: #111; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 6px; }
  #controls label { font-size: 12px; color: #333; display: flex; flex-direction: column; gap: 2px; }
  select, input { font-size: 13px; padding: 2px 4px; }
  #title { font-weight: 600; font-size: 15px; margin-right: 8px; }
  #hint { font-size: 11px; color: #666; margin: 2px 0 6px; }
  #siteTabs { display: flex; gap: 2px; margin-bottom: 6px; }
  .tab { font-size: 12px; padding: 4px 12px; border: 1px solid #ccc; border-bottom: none;
         background: #f0f0f0; cursor: pointer; border-radius: 4px 4px 0 0; }
  .tab.active { background: #fff; font-weight: 600; border-color: #999; }
  #lower { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .panel { border: 1px solid #ddd; }
  .cap { font-size: 12px; text-align: center; padding: 3px; background: #f6f6f6; color: #333; }
  #chart { cursor: pointer; }
  #scatter { cursor: crosshair; display: block; }
  #tooltip { position: fixed; pointer-events: none; background: rgba(0,0,0,.8); color: #fff;
             font-size: 11px; padding: 3px 6px; border-radius: 3px; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="controls">
  <span id="title">Direction scatter</span>
  <label>basis variable<select id="basis"></select></label>
  <label>arrows<select id="dirKind"></select></label>
  <label>threshold<input id="thresh" type="range" min="0" value="0" step="0.001" style="width:120px" /></label>
  <label>colour by<select id="colorBy"></select></label>
  <label>mod<input id="mod" type="number" min="1" value="1" style="width:60px" /></label>
  <label>offset<input id="offset" type="number" value="0" style="width:60px" /></label>
  <label>colour scale
    <span style="display:flex;align-items:center;gap:4px">
      <span id="legLo" style="font-size:10px;color:#444"></span>
      <canvas id="legend" width="120" height="12" style="border:1px solid #ccc"></canvas>
      <span id="legHi" style="font-size:10px;color:#444"></span>
    </span>
  </label>
</div>
<div id="hint"></div>
<div id="siteTabs"></div>
<div class="panel" style="display:inline-block">
  <div class="cap">held-out R² vs period — click a period to view its scatter (spikes = real features)</div>
  <canvas id="chart" width="1000" height="270"></canvas>
</div>
<div id="lower">
  <div class="panel">
    <div id="scatCap" class="cap"></div>
    <canvas id="scatter" width="460" height="460"></canvas>
  </div>
  <div class="panel" style="min-width:200px">
    <div class="cap">arrows shown (strongest first)</div>
    <div id="arrowList" style="font-size:11px;padding:6px;max-height:440px;overflow:auto"></div>
  </div>
</div>
<div id="tooltip"></div>
<script src="data.js"></script>
<script>
const D = window.PD_DATA;
const el = id => document.getElementById(id);
const tooltip = el("tooltip");

function decodeF16(b64) {
  const bin = atob(b64), n = bin.length / 2, out = new Float32Array(n);
  const dv = new DataView(new ArrayBuffer(2));
  for (let i = 0; i < n; i++) {
    dv.setUint8(0, bin.charCodeAt(2 * i)); dv.setUint8(1, bin.charCodeAt(2 * i + 1));
    const h = dv.getUint16(0, true);
    const s = (h & 0x8000) >> 15, e = (h & 0x7c00) >> 10, f = h & 0x03ff;
    let v;
    if (e === 0) v = (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024);
    else if (e === 0x1f) v = f ? NaN : (s ? -Infinity : Infinity);
    else v = (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + f / 1024);
    out[i] = v;
  }
  return out;
}
function decodeI16(b64) {
  const bin = atob(b64), n = bin.length / 2, out = new Int16Array(n);
  const dv = new DataView(new ArrayBuffer(2));
  for (let i = 0; i < n; i++) {
    dv.setUint8(0, bin.charCodeAt(2 * i)); dv.setUint8(1, bin.charCodeAt(2 * i + 1));
    out[i] = dv.getInt16(0, true);
  }
  return out;
}
function decodeI8(b64) {
  const bin = atob(b64), n = bin.length, out = new Int8Array(n);
  for (let i = 0; i < n; i++) out[i] = (bin.charCodeAt(i) << 24) >> 24;
  return out;
}
const _VIRIDIS = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
function viridis(t) {
  t = Math.max(0, Math.min(1, t)); const x = t * 4, i = Math.min(3, Math.floor(x)), f = x - i;
  const a = _VIRIDIS[i], b = _VIRIDIS[i + 1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}

const A = decodeI16(D.a), B = decodeI16(D.b);
const VAR_COLORS = { "a": "#1f77b4", "b": "#2ca02c", "a+b": "#d62728" };
const TAG_COLOR = { g: "#1f77b4", u: "#ff7f0e", d: "#c1121f" };  // gate-read / up-read / down-write
const TAG_NAME = { g: "gate read", u: "up read", d: "down write" };
const SIZE = 460;
const sel = { site: null, basis: null, period: null, colorBy: "a+b", mod: 1, offset: 0,
              dirKind: "neurons", thresh: D.meta.arrow_norm_default };
let scat = null;

function fill(node, values, labels) {
  node.innerHTML = "";
  values.forEach((v, i) => { const o = document.createElement("option");
    o.value = v; o.textContent = labels ? labels[i] : v; node.appendChild(o); });
}
fill(el("basis"), D.meta.variables, D.meta.variables.map(v => "probe: " + v));
fill(el("colorBy"), ["a", "b", "a+b"]);
fill(el("dirKind"), ["none", ...D.meta.kinds]);
sel.basis = D.meta.variables.includes("a+b") ? "a+b" : D.meta.variables[0];
el("basis").value = sel.basis; el("colorBy").value = sel.colorBy; el("dirKind").value = sel.dirKind;
el("thresh").max = D.meta.arrow_norm_hi; el("thresh").value = sel.thresh;

// site tabs: which residual-stream site the probes were fit on
const SITE_LABEL = {
  pre: "before MLP (input to RMSNorm)",
  norm: "MLP input (after RMSNorm)",
  mlp_out: "MLP output (Δ to residual)",
  post: "after MLP (L18 output)",
};
sel.site = D.meta.sites.includes("post") ? "post" : D.meta.sites[0];
D.meta.sites.forEach(s => {
  const t = document.createElement("div"); t.className = "tab" + (s === sel.site ? " active" : "");
  t.textContent = SITE_LABEL[s] || s;
  t.addEventListener("click", () => {
    sel.site = s;
    [...el("siteTabs").children].forEach(c => c.classList.toggle("active", c === t));
    drawChart(); rebuildScatter();
  });
  el("siteTabs").appendChild(t);
});

function periodsOf(v) { return D.meta.periods[v]; }
function nearestPeriodIdx(v, p) {  // index into periodsOf(v) of the closest period to p
  const ps = periodsOf(v); let bi = 0, bd = Infinity;
  for (let i = 0; i < ps.length; i++) { const d = Math.abs(ps[i] - p); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
sel.period = periodsOf(sel.basis)[nearestPeriodIdx(sel.basis, 10)];
sel.mod = sel.period; el("mod").value = sel.period;  // colour by residue so arrows meet their clusters

// ---- colour ---------------------------------------------------------------------------------
function rawValues() {
  if (sel.colorBy === "a") return A;
  if (sel.colorBy === "b") return B;
  const s = new Int32Array(A.length);
  for (let i = 0; i < A.length; i++) s[i] = A[i] + B[i];
  return s;
}
function colorInfo() {
  const raw = rawValues();
  if (sel.mod > 1) {
    const m = Math.round(sel.mod), k = Math.round(sel.offset), vals = new Float32Array(raw.length);
    for (let i = 0; i < raw.length; i++) vals[i] = ((raw[i] - k) % m + m) % m;
    return { raw, vals, lo: 0, span: Math.max(1, m - 1) };  // residues run 0..m-1
  }
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < raw.length; i++) { if (raw[i] < lo) lo = raw[i]; if (raw[i] > hi) hi = raw[i]; }
  return { raw, vals: raw, lo, span: Math.max(1e-9, hi - lo) };
}
function updateLegend(c) {
  const ctx = el("legend").getContext("2d");
  for (let px = 0; px < 120; px++) { ctx.fillStyle = viridis(px / 119); ctx.fillRect(px, 0, 1, 12); }
  el("legLo").textContent = (+c.lo).toFixed(Number.isInteger(c.lo) ? 0 : 2);
  el("legHi").textContent = (+(c.lo + c.span)).toFixed(Number.isInteger(c.lo + c.span) ? 0 : 2);
}

// ---- R² chart -------------------------------------------------------------------------------
const CH = { w: 1000, h: 270, l: 42, r: 15, t: 14, b: 28 };
function chartX(p) { const pMax = D.meta.max_period;
  return CH.l + (p - 2) / (pMax - 2) * (CH.w - CH.l - CH.r); }
let chartY;  // set in drawChart (depends on y range)
function drawChart() {
  const ctx = el("chart").getContext("2d");
  ctx.clearRect(0, 0, CH.w, CH.h);
  let lo = 0;
  for (const v of D.meta.variables) for (const r of D.meta.r2[sel.site][v]) if (r != null) lo = Math.min(lo, r);
  lo = Math.max(-0.5, lo);  // clip extreme negatives for display
  chartY = r => CH.t + (1 - (Math.max(lo, r) - lo) / (1 - lo)) * (CH.h - CH.t - CH.b);
  ctx.strokeStyle = "#eee"; ctx.fillStyle = "#888"; ctx.font = "10px sans-serif"; ctx.lineWidth = 1;
  for (const yv of [0, 0.5, 1]) { if (yv < lo) continue;
    const y = chartY(yv); ctx.beginPath(); ctx.moveTo(CH.l, y); ctx.lineTo(CH.w - CH.r, y); ctx.stroke();
    ctx.fillText("R²=" + yv, 4, y + 3); }
  ctx.setLineDash([3, 3]); ctx.strokeStyle = "#ccc";
  for (const p of D.meta.canonical) { if (p > D.meta.max_period) continue;
    const xp = chartX(p); ctx.beginPath(); ctx.moveTo(xp, CH.t); ctx.lineTo(xp, CH.h - CH.b); ctx.stroke();
    ctx.fillText(p, xp - 5, CH.h - CH.b + 12); }
  ctx.setLineDash([]);
  const xs = chartX(sel.period);
  ctx.strokeStyle = "#999"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xs, CH.t); ctx.lineTo(xs, CH.h - CH.b); ctx.stroke();
  D.meta.variables.forEach((v, vi) => {
    const ps = periodsOf(v), r2 = D.meta.r2[sel.site][v];
    ctx.strokeStyle = VAR_COLORS[v] || "#666"; ctx.lineWidth = 1.6; ctx.beginPath();
    let started = false;
    for (let i = 0; i < ps.length; i++) {
      if (r2[i] == null) { started = false; continue; }
      const x = chartX(ps[i]), y = chartY(r2[i]);
      if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
    }
    ctx.stroke();
    ctx.fillStyle = VAR_COLORS[v] || "#666";
    ctx.fillRect(CH.w - CH.r - 90, CH.t + 4 + vi * 14, 10, 10);
    ctx.fillText(v, CH.w - CH.r - 75, CH.t + 13 + vi * 14);
  });
  const ix = nearestPeriodIdx(sel.basis, sel.period), rv = D.meta.r2[sel.site][sel.basis][ix];
  if (rv != null) { ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(chartX(sel.period), chartY(rv), 4, 0, 7); ctx.fill(); }
}
el("chart").addEventListener("click", ev => {
  const r = el("chart").getBoundingClientRect(), mx = ev.clientX - r.left;
  const ps = periodsOf(sel.basis);
  let bi = 0, bd = Infinity;
  for (let i = 0; i < ps.length; i++) { const d = Math.abs(chartX(ps[i]) - mx); if (d < bd) { bd = d; bi = i; } }
  sel.period = ps[bi];
  sel.mod = sel.period; el("mod").value = sel.period;  // colour by residue mod the picked period
  drawChart(); rebuildScatter();
});

// ---- arrows ---------------------------------------------------------------------------------
function arrowsFor() {  // decoded arrows for the current (kind, site, basis, period)
  if (sel.dirKind === "none") return [];
  const rec = D.arrows[sel.dirKind][sel.site][sel.basis][nearestPeriodIdx(sel.basis, sel.period)];
  const mat = decodeI8(rec.mat), idx = decodeI16(rec.idx), cs = decodeF16(rec.cs);
  const T = sel.period, out = [];
  for (let i = 0; i < mat.length; i++) {
    const c = cs[2 * i], s = cs[2 * i + 1], norm = Math.hypot(c, s);
    const residue = (((Math.atan2(s, c) / (2 * Math.PI / T)) % T) + T) % T;
    out.push({ tag: D.meta.mat_labels[mat[i]], id: idx[i], c, s, norm, residue });
  }
  return out;
}
function drawArrowhead(ctx, x0, y0, x1, y1, color) {
  const ang = Math.atan2(y1 - y0, x1 - x0), h = 8;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - h * Math.cos(ang - 0.4), y1 - h * Math.sin(ang - 0.4));
  ctx.lineTo(x1 - h * Math.cos(ang + 0.4), y1 - h * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill();
}

// ---- scatter --------------------------------------------------------------------------------
function initView(pts, arrows) {
  let sx = 0, sy = 0; const np = pts.length / 2;
  for (let i = 0; i < pts.length; i += 2) { sx += pts[i]; sy += pts[i + 1]; }
  const cx = sx / np, cy = sy / np, rs = [];
  for (let i = 0; i < pts.length; i += 2) rs.push(Math.hypot(pts[i] - cx, pts[i + 1] - cy));
  rs.sort((a, b) => a - b);
  let r = rs[Math.floor(rs.length * 0.98)] || 1;
  for (const ar of arrows) if (ar.norm >= sel.thresh) r = Math.max(r, ar.norm);  // fit shown arrows too
  return { k: (SIZE * 0.9) / (2 * r), cx, cy };
}
function drawScatter() {
  const st = scat, ctx = st.ctx, v = st.view, c = st.color, pts = st.points;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const cx = SIZE / 2, cy = SIZE / 2;
  for (let j = 0; j < pts.length / 2; j++) {
    const px = cx + (pts[2 * j] - v.cx) * v.k, py = cy - (pts[2 * j + 1] - v.cy) * v.k;
    if (px < -2 || px > SIZE + 2 || py < -2 || py > SIZE + 2) continue;
    const val = c.vals[j];
    ctx.fillStyle = isNaN(val) ? "#ccc" : viridis((val - c.lo) / c.span);
    ctx.fillRect(px - 1, py - 1, 2, 2);
  }
  // origin (ring centre) crosshair — arrows emanate from here
  const ox = cx + (0 - v.cx) * v.k, oy = cy - (0 - v.cy) * v.k;
  ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ox - 5, oy); ctx.lineTo(ox + 5, oy);
  ctx.moveTo(ox, oy - 5); ctx.lineTo(ox, oy + 5); ctx.stroke();
  // arrows from origin
  let shown = 0;
  for (const ar of st.arrows) {
    if (ar.norm < sel.thresh) continue;
    shown++;
    const x1 = cx + (ar.c - v.cx) * v.k, y1 = cy - (ar.s - v.cy) * v.k;
    const col = TAG_COLOR[ar.tag] || "#666";
    ctx.strokeStyle = col; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x1, y1); ctx.stroke();
    drawArrowhead(ctx, ox, oy, x1, y1, col);
  }
  st.shown = shown;
}
function pointAt(st, px, py) {
  const v = st.view, cx = SIZE / 2, cy = SIZE / 2, pts = st.points; let best = -1, bd = 36;
  for (let j = 0; j < pts.length / 2; j++) {
    const sx = cx + (pts[2 * j] - v.cx) * v.k, sy = cy - (pts[2 * j + 1] - v.cy) * v.k;
    const d = (sx - px) ** 2 + (sy - py) ** 2; if (d < bd) { bd = d; best = j; }
  }
  return best;
}
function arrowAt(st, px, py) {  // nearest shown arrow tip within 10px
  const v = st.view, cx = SIZE / 2, cy = SIZE / 2; let best = null, bd = 100;
  for (const ar of st.arrows) {
    if (ar.norm < sel.thresh) continue;
    const sx = cx + (ar.c - v.cx) * v.k, sy = cy - (ar.s - v.cy) * v.k;
    const d = (sx - px) ** 2 + (sy - py) ** 2; if (d < bd) { bd = d; best = ar; }
  }
  return best;
}
const cv = el("scatter");
cv.addEventListener("wheel", ev => {
  ev.preventDefault(); const st = scat;
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const wx = st.view.cx + (mx - SIZE / 2) / st.view.k, wy = st.view.cy - (my - SIZE / 2) / st.view.k;
  st.view.k *= ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  st.view.cx = wx - (mx - SIZE / 2) / st.view.k; st.view.cy = wy + (my - SIZE / 2) / st.view.k;
  drawScatter();
}, { passive: false });
let drag = null;
cv.addEventListener("mousedown", ev => { drag = { x: ev.offsetX, y: ev.offsetY, cx: scat.view.cx, cy: scat.view.cy }; });
window.addEventListener("mouseup", () => { drag = null; });
cv.addEventListener("mousemove", ev => {
  const st = scat; if (!st) return;
  if (drag) {
    st.view.cx = drag.cx - (ev.offsetX - drag.x) / st.view.k;
    st.view.cy = drag.cy + (ev.offsetY - drag.y) / st.view.k; drawScatter(); return;
  }
  const ar = arrowAt(st, ev.offsetX, ev.offsetY);
  if (ar) {
    tooltip.style.display = "block";
    tooltip.style.left = (ev.clientX + 12) + "px"; tooltip.style.top = (ev.clientY + 12) + "px";
    tooltip.textContent = `${ar.tag}${ar.id} (${TAG_NAME[ar.tag]})  |v·d|=${ar.norm.toFixed(3)}  ~res ${ar.residue.toFixed(2)}`;
    return;
  }
  const j = pointAt(st, ev.offsetX, ev.offsetY);
  if (j < 0) { tooltip.style.display = "none"; return; }
  tooltip.style.display = "block";
  tooltip.style.left = (ev.clientX + 12) + "px"; tooltip.style.top = (ev.clientY + 12) + "px";
  tooltip.textContent = `${sel.colorBy}=${st.color.raw[j]}  (${A[j]}+${B[j]}=${A[j] + B[j]})`;
});
cv.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });

function renderArrowList() {
  const shown = scat.arrows.filter(ar => ar.norm >= sel.thresh);
  el("arrowList").innerHTML = shown.map(ar =>
    `<div style="display:flex;gap:6px;align-items:center">
       <span style="width:10px;height:10px;background:${TAG_COLOR[ar.tag]};display:inline-block"></span>
       <b>${ar.tag}${ar.id}</b> · ${ar.norm.toFixed(3)} · res ${ar.residue.toFixed(2)}</div>`
  ).join("") || "<i>none above threshold</i>";
}
function rebuildScatter() {
  const idx = nearestPeriodIdx(sel.basis, sel.period);
  const points = decodeF16(D.points[sel.site][sel.basis][idx]);
  const arrows = arrowsFor();
  const color = colorInfo(); updateLegend(color);
  scat = { ctx: cv.getContext("2d"), view: initView(points, arrows), points, arrows, color };
  const r2 = D.meta.r2[sel.site][sel.basis][idx];
  const dir = (sel.basis === "a+b") ? "write" : "read";
  el("scatCap").textContent = `${SITE_LABEL[sel.site] || sel.site} — basis "${sel.basis}" (${dir}), period ${sel.period}`
    + (r2 == null ? "" : `  (R²=${r2.toFixed(3)})`);
  drawScatter(); renderArrowList();
}
function recolor() {
  sel.colorBy = el("colorBy").value; sel.mod = parseFloat(el("mod").value) || 1;
  sel.offset = parseFloat(el("offset").value) || 0;
  if (!scat) return; scat.color = colorInfo(); updateLegend(scat.color); drawScatter();
}

el("basis").addEventListener("change", () => {
  sel.basis = el("basis").value;
  sel.period = periodsOf(sel.basis)[nearestPeriodIdx(sel.basis, sel.period)];
  drawChart(); rebuildScatter();
});
el("dirKind").addEventListener("change", () => { sel.dirKind = el("dirKind").value; rebuildScatter(); });
el("thresh").addEventListener("input", () => {
  sel.thresh = parseFloat(el("thresh").value) || 0;
  if (scat) { scat.view = initView(scat.points, scat.arrows); drawScatter(); renderArrowList(); }
});
el("colorBy").addEventListener("change", recolor);
el("mod").addEventListener("input", recolor);
el("offset").addEventListener("input", recolor);

el("title").textContent = `Direction scatter — ${D.meta.run}`;
el("hint").textContent = `L${D.meta.layer} MLP ${D.meta.kinds.join(" / ")} directions on the normalised Fourier plane`
  + ` (read g/u on operands a,b; write d on a+b). Arrows = unit·probe (Fig 9c scale), from the ring centre;`
  + ` threshold filters by |v·d|. Cloud: ${D.meta.n_show} of ${D.meta.n_total} activations, centred & rescaled.`;
drawChart(); rebuildScatter();
</script>
</body>
</html>
