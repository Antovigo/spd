<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Probe scatter — activations in the Fourier-probe basis</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 10px; color: #111; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 8px; }
  #controls label { font-size: 12px; color: #333; display: flex; flex-direction: column; gap: 2px; }
  select, input { font-size: 13px; padding: 2px 4px; }
  #title { font-weight: 600; font-size: 15px; margin-right: 8px; }
  #hint { font-size: 11px; color: #666; margin: 2px 0 8px; }
  #plots { display: flex; flex-wrap: wrap; gap: 10px; }
  .plot { border: 1px solid #ddd; }
  .cap { font-size: 12px; text-align: center; padding: 2px; background: #f6f6f6; color: #333; }
  canvas { display: block; cursor: crosshair; }
  #tooltip { position: fixed; pointer-events: none; background: rgba(0,0,0,.8); color: #fff;
             font-size: 11px; padding: 3px 6px; border-radius: 3px; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="controls">
  <span id="title">Probe scatter</span>
  <label>basis variable<select id="basis"></select></label>
  <label>colour by<select id="colorBy"></select></label>
  <label>mod<input id="mod" type="number" min="1" value="1" style="width:70px" /></label>
  <label>offset<input id="offset" type="number" value="0" style="width:70px" /></label>
  <label>colour scale
    <span style="display:flex;align-items:center;gap:4px">
      <span id="legLo" style="font-size:10px;color:#444"></span>
      <canvas id="legend" width="120" height="12" style="border:1px solid #ccc"></canvas>
      <span id="legHi" style="font-size:10px;color:#444"></span>
    </span>
  </label>
</div>
<div id="hint"></div>
<div id="plots"></div>
<div id="tooltip"></div>
<script src="data.js"></script>
<script>
const D = window.PD_DATA;
const SIZE = 340;
const el = id => document.getElementById(id);
const tooltip = el("tooltip");

function decodeF16(b64) {
  const bin = atob(b64), n = bin.length / 2, out = new Float32Array(n);
  const dv = new DataView(new ArrayBuffer(2));
  for (let i = 0; i < n; i++) {
    dv.setUint8(0, bin.charCodeAt(2 * i)); dv.setUint8(1, bin.charCodeAt(2 * i + 1));
    const h = dv.getUint16(0, true);
    const s = (h & 0x8000) >> 15, e = (h & 0x7c00) >> 10, f = h & 0x03ff;
    let v;
    if (e === 0) v = (s ? -1 : 1) * Math.pow(2, -14) * (f / 1024);
    else if (e === 0x1f) v = f ? NaN : (s ? -Infinity : Infinity);
    else v = (s ? -1 : 1) * Math.pow(2, e - 15) * (1 + f / 1024);
    out[i] = v;
  }
  return out;
}
function decodeI16(b64) {
  const bin = atob(b64), n = bin.length / 2, out = new Int16Array(n);
  const dv = new DataView(new ArrayBuffer(2));
  for (let i = 0; i < n; i++) {
    dv.setUint8(0, bin.charCodeAt(2 * i)); dv.setUint8(1, bin.charCodeAt(2 * i + 1));
    out[i] = dv.getInt16(0, true);
  }
  return out;
}

const _VIRIDIS = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
function viridis(t) {
  t = Math.max(0, Math.min(1, t)); const x = t * 4, i = Math.min(3, Math.floor(x)), f = x - i;
  const a = _VIRIDIS[i], b = _VIRIDIS[i + 1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}

const A = decodeI16(D.a), B = decodeI16(D.b);
const sel = { basis: null, colorBy: "a+b", mod: 1, offset: 0 };
let plots = [];

function fill(node, values, labels) {
  node.innerHTML = "";
  values.forEach((v, i) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = labels ? labels[i] : v; node.appendChild(o);
  });
}
fill(el("basis"), D.meta.variables, D.meta.variables.map(v => "probe: " + v));
fill(el("colorBy"), ["a", "b", "a+b"]);
sel.basis = D.meta.variables.includes("a+b") ? "a+b" : D.meta.variables[0];
el("basis").value = sel.basis; el("colorBy").value = sel.colorBy;

// raw colour value per point (before mod/offset)
function rawValues() {
  if (sel.colorBy === "a") return A;
  if (sel.colorBy === "b") return B;
  const s = new Int32Array(A.length);
  for (let i = 0; i < A.length; i++) s[i] = A[i] + B[i];
  return s;
}
function colorInfo() {
  const raw = rawValues();
  if (sel.mod > 1) {
    const m = Math.round(sel.mod), k = Math.round(sel.offset);
    const vals = new Float32Array(raw.length);
    for (let i = 0; i < raw.length; i++) vals[i] = ((raw[i] - k) % m + m) % m;
    return { raw, vals, lo: 0, span: Math.max(1, m - 1) };  // residues run 0..m-1
  }
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < raw.length; i++) { if (raw[i] < lo) lo = raw[i]; if (raw[i] > hi) hi = raw[i]; }
  return { raw, vals: raw, lo, span: Math.max(1e-9, hi - lo) };
}

function updateLegend(c) {
  const ctx = el("legend").getContext("2d");
  for (let px = 0; px < 120; px++) { ctx.fillStyle = viridis(px / 119); ctx.fillRect(px, 0, 1, 12); }
  el("legLo").textContent = (+c.lo).toFixed(Number.isInteger(c.lo) ? 0 : 2);
  el("legHi").textContent = (+(c.lo + c.span)).toFixed(Number.isInteger(c.lo + c.span) ? 0 : 2);
}

function initView(pts) {
  let sx = 0, sy = 0; const np = pts.length / 2;
  for (let i = 0; i < pts.length; i += 2) { sx += pts[i]; sy += pts[i + 1]; }
  const cx = sx / np, cy = sy / np, rs = [];
  for (let i = 0; i < pts.length; i += 2) rs.push(Math.hypot(pts[i] - cx, pts[i + 1] - cy));
  rs.sort((a, b) => a - b);
  const r = rs[Math.floor(rs.length * 0.98)] || 1;
  return { k: (SIZE * 0.9) / (2 * r), cx, cy };
}

function draw(st) {
  const ctx = st.ctx, v = st.view, c = st.color, pts = st.points;
  ctx.clearRect(0, 0, SIZE, SIZE);
  const cx = SIZE / 2, cy = SIZE / 2;
  for (let j = 0; j < pts.length / 2; j++) {
    const px = cx + (pts[2 * j] - v.cx) * v.k, py = cy - (pts[2 * j + 1] - v.cy) * v.k;
    if (px < -2 || px > SIZE + 2 || py < -2 || py > SIZE + 2) continue;
    const val = c.vals[j];
    ctx.fillStyle = isNaN(val) ? "#ccc" : viridis((val - c.lo) / c.span);
    ctx.fillRect(px - 1, py - 1, 2, 2);
  }
  // circle centre marker
  const mx = cx + (st.center[0] - v.cx) * v.k, my = cy - (st.center[1] - v.cy) * v.k;
  ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(mx - 5, my); ctx.lineTo(mx + 5, my);
  ctx.moveTo(mx, my - 5); ctx.lineTo(mx, my + 5); ctx.stroke();
}

function pointAt(st, px, py) {
  const v = st.view, cx = SIZE / 2, cy = SIZE / 2; let best = -1, bd = 36;
  const pts = st.points;
  for (let j = 0; j < pts.length / 2; j++) {
    const sx = cx + (pts[2 * j] - v.cx) * v.k, sy = cy - (pts[2 * j + 1] - v.cy) * v.k;
    const d = (sx - px) ** 2 + (sy - py) ** 2;
    if (d < bd) { bd = d; best = j; }
  }
  return best;
}

function attach(st) {
  const cv = st.canvas;
  cv.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const wx = st.view.cx + (mx - SIZE / 2) / st.view.k, wy = st.view.cy - (my - SIZE / 2) / st.view.k;
    st.view.k *= ev.deltaY < 0 ? 1.15 : 1 / 1.15;
    st.view.cx = wx - (mx - SIZE / 2) / st.view.k; st.view.cy = wy + (my - SIZE / 2) / st.view.k;
    draw(st);
  }, { passive: false });
  let drag = null;
  cv.addEventListener("mousedown", ev => { drag = { x: ev.offsetX, y: ev.offsetY, cx: st.view.cx, cy: st.view.cy }; });
  window.addEventListener("mouseup", () => { drag = null; });
  cv.addEventListener("mousemove", ev => {
    if (drag) {
      st.view.cx = drag.cx - (ev.offsetX - drag.x) / st.view.k;
      st.view.cy = drag.cy + (ev.offsetY - drag.y) / st.view.k;
      draw(st); return;
    }
    const j = pointAt(st, ev.offsetX, ev.offsetY);
    if (j < 0) { tooltip.style.display = "none"; return; }
    const raw = st.color.raw[j];
    tooltip.style.display = "block";
    tooltip.style.left = (ev.clientX + 12) + "px"; tooltip.style.top = (ev.clientY + 12) + "px";
    tooltip.textContent = `${sel.colorBy}=${raw}  (${A[j]}+${B[j]}=${A[j] + B[j]})`;
  });
  cv.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
}

function rebuild() {
  sel.basis = el("basis").value; sel.colorBy = el("colorBy").value;
  sel.mod = parseFloat(el("mod").value) || 1; sel.offset = parseFloat(el("offset").value) || 0;
  const color = colorInfo();
  updateLegend(color);
  el("hint").textContent = `activations projected onto the a+b= probe basis (variable "${sel.basis}"), `
    + `layer ${D.meta.layer} residual output, a,b in 1..${D.meta.max_value} (${D.meta.n} points). `
    + `Predicted (cos,sin); a clean feature traces the unit circle.`;
  const container = el("plots"); container.innerHTML = ""; plots = [];
  D.meta.periods.forEach((pv, pi) => {
    const wrap = document.createElement("div"); wrap.className = "plot";
    const cap = document.createElement("div"); cap.className = "cap";
    const r2 = D.meta.r2[sel.basis][pi];
    cap.textContent = `period ${pv}` + (r2 == null ? "" : `  (R²=${r2.toFixed(3)})`);
    const canvas = document.createElement("canvas"); canvas.width = SIZE; canvas.height = SIZE;
    wrap.appendChild(cap); wrap.appendChild(canvas); container.appendChild(wrap);
    const points = decodeF16(D.points[sel.basis][pi]);
    const st = { canvas, ctx: canvas.getContext("2d"), view: initView(points), points, color,
                 center: D.centers[sel.basis][pi] };
    attach(st); plots.push(st); draw(st);
  });
}
function recolor() {
  sel.colorBy = el("colorBy").value; sel.mod = parseFloat(el("mod").value) || 1;
  sel.offset = parseFloat(el("offset").value) || 0;
  const color = colorInfo(); updateLegend(color);
  plots.forEach(st => { st.color = color; draw(st); });
}

el("basis").addEventListener("change", rebuild);
el("colorBy").addEventListener("change", recolor);
el("mod").addEventListener("input", recolor);
el("offset").addEventListener("input", recolor);
rebuild();
</script>
</body>
</html>
