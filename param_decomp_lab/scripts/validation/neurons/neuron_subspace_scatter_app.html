<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neuron subspace scatter</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #fff; color: #222; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 10px 0 0; }
  label { font-size: 13px; }
  select, input { font-size: 13px; padding: 2px 4px; }
  #wrap { display: flex; }
  #scatter { flex: 1; min-width: 0; height: calc(100vh - 52px); }
  #panel { width: 600px; border-left: 1px solid #ddd; overflow-y: auto; height: calc(100vh - 52px); padding: 8px; box-sizing: border-box; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .task-section { width: 100%; font-size: 14px; font-weight: 700; color: #222; border-top: 2px solid #888; padding: 10px 2px 2px; margin-top: 8px; text-transform: capitalize; }
  .section { width: 100%; font-size: 12px; font-weight: 600; color: #777; padding: 4px 2px 2px; }
  .card { width: 132px; cursor: pointer; border: 2px solid transparent; border-radius: 4px; padding: 2px; text-align: center; box-sizing: border-box; }
  .card:hover { background: #f3f3f3; }
  .card.sel { border-color: #d62728; background: #fdeaea; }
  .card img { width: 128px; height: 128px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .card span { font-size: 12px; }
  #hint { font-size: 12px; color: #888; }
  #nidErr { font-size: 12px; color: #c33; }
</style>
<script>/*__PLOTLY_JS__*/</script>
</head>
<body>
<header>
  <h1>Neuron subspace scatter</h1>
  <label>side <select id="side"></select></label>
  <label>points <select id="ptask"></select></label>
  <label>colour <select id="color"><option value="result">result</option><option value="a">a</option><option value="b">b</option></select></label>
  <label>mod <select id="mod"></select></label>
  <label>offset <input id="offset" type="number" value="0" style="width: 56px" /></label>
  <label>neuron # <input id="nid" type="number" min="0" style="width: 72px" /></label>
  <button id="nidAdd">add</button>
  <span id="nidErr"></span>
  <span id="hint"></span>
</header>
<div id="wrap">
  <div id="scatter"></div>
  <div id="panel"><div class="grid" id="grid"></div></div>
</div>
<script src="data.js"></script>
<script>
const D = window.PD_DATA, META = D.meta, N = META.n;
const elSide = document.getElementById("side"), elColor = document.getElementById("color");
const elMod = document.getElementById("mod"), elPtask = document.getElementById("ptask");
const elOffset = document.getElementById("offset"), elNid = document.getElementById("nid");
const elNidErr = document.getElementById("nidErr");
const grid = document.getElementById("grid"), hint = document.getElementById("hint");
const SIDE_LABEL = { "input-gate": "input · gate read", "input-up": "input · up read", "output": "output · down write" };
let selected = [];  // neuron ids, pick order, max 3

META.sides.forEach(s => elSide.add(new Option(SIDE_LABEL[s] || s, s)));
META.ops.forEach(op => elPtask.add(new Option(op, op)));
elMod.add(new Option("none", 1));
META.mods.forEach(m => elMod.add(new Option("mod " + m, m)));
const rowOf = {}; D.neurons.forEach((m, i) => { rowOf[m.id] = i; });
const byId = {}; D.neurons.forEach(m => { byId[m.id] = m; });

// ---- projection decode (uint8-quantized per side/op/neuron grid) ----
const _cache = {};
function projOf(side, op, nid) {
  const key = side + "|" + op + "|" + nid;
  if (_cache[key]) return _cache[key];
  const q = D.sides[side].grids[op][String(nid)];
  const bin = atob(q.b64), out = new Float32Array(bin.length);
  const scale = (q.hi - q.lo) / 255;
  for (let i = 0; i < bin.length; i++) out[i] = q.lo + bin.charCodeAt(i) * scale;
  return (_cache[key] = out);
}

// ---- colouring ----
function baseValue(p) {  // p = a*N + b over the full grid
  const a = Math.floor(p / N), b = p % N;
  if (elColor.value === "a") return a;
  if (elColor.value === "b") return b;
  return elPtask.value === "sub" ? a - b : a + b;
}
function colorArr() {
  const m = +elMod.value, off = +elOffset.value || 0, out = new Array(N * N);
  for (let p = 0; p < N * N; p++) {
    const v = baseValue(p);
    out[p] = m <= 1 ? v : (((v - off) % m) + m) % m;
  }
  return out;
}
const colorLabel = () => {
  const m = +elMod.value, off = +elOffset.value || 0;
  const name = elColor.value === "result" ? (elPtask.value === "sub" ? "a−b" : "a+b") : elColor.value;
  if (m <= 1) return name;
  return (off ? `(${name}−${off})` : name) + " mod " + m;
};

// ---- true-angle embedding (as in the subcomponent subspace scatter) ----
// Cholesky of the picked directions' unit Gram: lower-triangular L with L Lᵀ = G, so its rows
// are unit vectors at the directions' true mutual angles.
function cholesky(G) {
  const k = G.length, L = Array.from({ length: k }, () => new Array(k).fill(0));
  for (let i = 0; i < k; i++)
    for (let j = 0; j <= i; j++) {
      let sum = G[i][j];
      for (let m = 0; m < j; m++) sum -= L[i][m] * L[j][m];
      L[i][j] = i === j ? Math.sqrt(Math.max(sum, 1e-9)) : sum / L[j][j];
    }
  return L;
}
// Solve L P = s for P (forward substitution) — the point with inner products s along the axes.
function forwardSolve(L, s) {
  const k = L.length, P = new Array(k);
  for (let i = 0; i < k; i++) {
    let v = s[i];
    for (let m = 0; m < i; m++) v -= L[i][m] * P[m];
    P[i] = v / L[i][i];
  }
  return P;
}

// ---- pick list ----
function renderList() {
  grid.innerHTML = "";
  const side = elSide.value;
  META.ops.forEach(op => {
    const h = document.createElement("div"); h.className = "task-section"; h.textContent = op; grid.appendChild(h);
    const groups = new Map();  // period → neurons (0 = none, listed last)
    D.neurons.forEach(m => {
      const p = m.period[op];
      if (!groups.has(p)) groups.set(p, []);
      groups.get(p).push(m);
    });
    [...groups.keys()].sort((x, y) => (x || 1e9) - (y || 1e9)).forEach(p => {
      const s = document.createElement("div"); s.className = "section";
      s.textContent = p ? "period " + p : "no period";
      grid.appendChild(s);
      groups.get(p).forEach(m => {
        const card = document.createElement("div");
        card.className = "card" + (selected.includes(m.id) ? " sel" : "");
        card.innerHTML = `<img src="${D.sides[side].thumbs[op][String(m.id)]}" alt=""><span>${m.id} · KL ${m.kl[op]}</span>`;
        card.onclick = () => toggle(m.id);
        grid.appendChild(card);
      });
    });
  });
}

function toggle(nid) {
  const at = selected.indexOf(nid);
  if (at >= 0) selected.splice(at, 1);
  else if (selected.length < 3) selected.push(nid);
  else return;  // already 3 picked — deselect one first
  renderList();
  drawScatter();
}
document.getElementById("nidAdd").onclick = () => {
  const nid = +elNid.value;
  elNidErr.textContent = "";
  if (!byId[nid]) { elNidErr.textContent = `${nid} not shipped (max_kl ≤ ${META.kl_thr})`; return; }
  if (!selected.includes(nid) && selected.length >= 3) { elNidErr.textContent = "3 picked — deselect one first"; return; }
  toggle(nid);
};
elNid.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("nidAdd").click(); });

// ---- scatter ----
function drawScatter() {
  const k = selected.length;
  hint.textContent = `${k}/3 picked${k ? ": " + selected.join(", ") : " — pick neurons on the right or type an index"}`;
  const gd = document.getElementById("scatter");
  if (k === 0) { Plotly.react("scatter", [], {}); return; }
  const side = elSide.value, op = elPtask.value;
  const gram = D.sides[side].gram;
  const L = cholesky(selected.map(i => selected.map(j => gram[rowOf[i]][rowOf[j]])));
  const s = selected.map(nid => projOf(side, op, nid));
  const M = N * N, X = new Array(M), Y = new Array(M), Z = new Array(M), text = new Array(M);
  let zmin = Infinity, lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let p = 0; p < M; p++) {
    const P = forwardSolve(L, s.map(g => g[p]));
    const x = P[0] || 0, y = P[1] || 0, z = P[2] || 0;
    X[p] = x; Y[p] = y; Z[p] = z;
    if (z < zmin) zmin = z;
    if (x < lo[0]) lo[0] = x; if (x > hi[0]) hi[0] = x;
    if (y < lo[1]) lo[1] = y; if (y > hi[1]) hi[1] = y;
    if (z < lo[2]) lo[2] = z; if (z > hi[2]) hi[2] = z;
    text[p] = `a=${Math.floor(p / N)} b=${p % N}`;
  }
  const span = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2], 1e-6);
  const shadow = {
    type: "scatter3d", mode: "markers", x: X, y: Y, z: X.map(() => zmin),
    marker: { size: 2, color: "#555", opacity: 0.3 }, hoverinfo: "skip", showlegend: false,
  };
  const trace = {
    type: "scatter3d", mode: "markers", x: X, y: Y, z: Z,
    marker: { size: 2.5, color: colorArr(), colorscale: "Viridis", showscale: true, colorbar: { title: { text: colorLabel() }, thickness: 12 } },
    text, hoverinfo: "text", showlegend: false,
  };
  const arrowLen = 0.75 * span;
  const axisTraces = selected.map((nid, i) => {
    const f = [0, 0, 0];
    for (let m = 0; m <= i; m++) f[m] = L[i][m];
    return {
      type: "scatter3d", mode: "lines+text",
      x: [0, arrowLen * f[0]], y: [0, arrowLen * f[1]], z: [0, arrowLen * f[2]],
      line: { color: "#d62728", width: 3 }, text: ["", String(nid)],
      textposition: "top center", textfont: { size: 13, color: "#d62728" }, hoverinfo: "skip", showlegend: false,
    };
  });
  const scene = { aspectmode: "data", xaxis: { title: "" }, yaxis: { title: "" }, zaxis: { title: "" } };
  const cam = gd._fullLayout && gd._fullLayout.scene && gd._fullLayout.scene.camera;
  if (cam) scene.camera = cam;
  Plotly.react("scatter", [shadow, trace, ...axisTraces], { margin: { l: 0, r: 0, t: 10, b: 0 }, scene }, { responsive: true });
}

elSide.onchange = () => { renderList(); drawScatter(); };
elColor.onchange = drawScatter;
elMod.onchange = drawScatter;
elOffset.oninput = drawScatter;
elPtask.onchange = drawScatter;
renderList();
drawScatter();
</script>
</body>
</html>
